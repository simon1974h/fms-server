<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Störung melden</title>
<style>
:root{--bg:#EEF2F3;--surface:#fff;--ink:#15212A;--muted:#5A6A75;--line:#D9E1E5;--accent:#0B6E79;--red:#B3261E;--redbg:#F9DCDA;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1519;--surface:#162027;--ink:#E4ECF0;--muted:#8C9EA9;--line:#26343D;--accent:#4EBFCC;--red:#F28B82;--redbg:#3D1C1A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
.where{color:var(--muted);font-size:15px;margin:-6px 0 0}
.where b{color:var(--ink)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input,textarea{font:inherit;color:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.chk{flex-direction:row;align-items:center;gap:10px;font-weight:500;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.chk input{width:22px;height:22px;flex:none}
.chk:has(input:checked){border-color:var(--red);background:var(--redbg);color:var(--red)}
button{font:inherit;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.5}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--red);font-size:14px;margin:0}
.ok{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
[hidden]{display:none!important}
</style></head>
<body><main>
<form class="card" id="f" novalidate>
  <h1>Störung melden</h1>
  <p class="where" id="where"></p>
  <label>Was ist defekt oder fällt auf?<textarea id="was" required placeholder="z. B. Deckenleuchte flackert, Wasserhahn tropft …"></textarea></label>
  <label>Wo genau?<input id="ort" placeholder="Raum, Etage, Bereich"></label>
  <label>Ihr Name<input id="name" autocomplete="name" placeholder="Vor- und Nachname"></label>
  <label class="chk"><input type="checkbox" id="dringend"> Dringend – Gefahr, Wasser, Strom oder Ausfall</label>
  <p class="err" id="err" hidden></p>
  <button type="submit">E-Mail erstellen</button>
  <p class="note">Ihr E-Mail-Programm öffnet sich mit der fertigen Nachricht. Bitte dort nur noch auf „Senden“ tippen. Bei Gefahr zusätzlich telefonisch melden.</p>
</form>
<div class="ok" id="fallback" hidden>
  <p><b>Kein E-Mail-Programm geöffnet?</b> Dann bitte diesen Text kopieren und an <b id="toTxt"></b> senden.</p>
  <button type="button" class="sec" id="copy">Text kopieren</button>
</div>
</main>
<script>
(function(){
  const P=new URLSearchParams(location.search),lieg=(P.get("l")||"").trim(),ort=(P.get("o")||"").trim(),to=(P.get("t")||"").trim();
  const $=s=>document.querySelector(s);
  $("#where").innerHTML=lieg?`für <b></b>`:"";if(lieg)$("#where b").textContent=lieg+(ort?" · "+ort:"");
  $("#ort").value=ort;
  try{$("#name").value=localStorage.getItem("melder-name")||""}catch(e){}
  let text="",subj="";
  $("#f").addEventListener("submit",e=>{e.preventDefault();
    const was=$("#was").value.trim(),wo=$("#ort").value.trim(),name=$("#name").value.trim(),dr=$("#dringend").checked;
    if(!was){$("#err").textContent="Bitte kurz beschreiben, was defekt ist.";$("#err").hidden=false;$("#was").focus();return}
    if(!/^[^@\s]+@[^@\s]+$/.test(to)){$("#err").textContent="Für diesen QR-Code ist keine Empfänger-Adresse hinterlegt. Bitte beim Hausmeister melden.";$("#err").hidden=false;return}
    $("#err").hidden=true;try{localStorage.setItem("melder-name",name)}catch(e){}
    const kurz=was.split("\n")[0].slice(0,70);
    subj=`${dr?"DRINGEND – ":""}Störung${wo?" "+wo:""}${lieg?" – "+lieg:""}: ${kurz}`;
    text=["Störungsmeldung über QR-Code","",`Liegenschaft: ${lieg||"–"}`,`Ort im Gebäude: ${wo||"–"}`,`Dringlichkeit: ${dr?"dringend":"normal"}`,`Gemeldet von: ${name||"–"}`,"","Beschreibung:",was].join("\n");
    location.href=`mailto:${encodeURIComponent(to).replace(/%40/g,"@")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(text)}`;
    $("#toTxt").textContent=to;setTimeout(()=>{$("#fallback").hidden=false},1500)});
  $("#copy").addEventListener("click",async()=>{const all=`Betreff: ${subj}\n\n${text}`;
    try{await navigator.clipboard.writeText(all);$("#copy").textContent="Kopiert"}catch(e){prompt("Text kopieren:",all)}});
})();
</script>
</body></html>
