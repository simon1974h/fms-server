/* ---------- Automatische Aufträge aus Wartungsplänen ---------- */
function autoGenerate(){return; /* Wartungen erzeugen keine Aufträge mehr – Aufträge sind nur Störungen/Reparaturen */
  if(LAD_ONLY||!C.wartung.loaded||!C.auftraege.loaded)return;
  let made=0;
  recs("wartung").forEach(([pid,p])=>{
    if(p.auto==="nein")return;const n=planNext(p);if(!n)return;
    if(daysUntil(n)>num(p.vorlauf||30))return;if(openTicketFor("planId",pid))return;if(p.lastGen===n)return;
    /* feste ID je Plan und Fälligkeit: legen iPad und PC denselben Auftrag an, wird er beim Abgleich zu einem */
    const tid="auto-"+pid+"-"+n;
    if(!C.auftraege.map.has(tid)){createTicket({titel:p.bez,lieg:p.lieg,anlage:p.anlage||"",kat:p.kat||"",zust:p.dienst||"",frist:n,planId:pid,quelle:"Wartungsplan",
      text:[p.grundlage?"Grundlage: "+p.grundlage:"",p.notiz||""].filter(Boolean).join("\n")},"Automatisch aus Wartungsplan angelegt",tid);made++}
    p.lastGen=n;cTouch("wartung",pid);
  });
  if(made){setSave("ok",`${made} Auftr${made>1?"äge":"ag"} aus Wartungsplänen angelegt`);renderNav();if(view!=="lieg")renderMod()}
}
/* Nach Abgleich/Einlesen: doppelt vergebene Auftragsnummern (auf zwei Geräten gleichzeitig angelegt) eindeutig machen.
   Feste Regel (ältester Auftrag behält die Nummer), damit beide Geräte zum selben Ergebnis kommen. */
function fixTicketNumbers(){const by={};let n=0;
  tickets().forEach(([id,t])=>{if(t.nr)(by[t.nr]=by[t.nr]||[]).push([id,t])});
  Object.values(by).filter(g=>g.length>1).forEach(g=>{g.sort((a,b)=>(a[1].log?.[0]?.at||0)-(b[1].log?.[0]?.at||0)||String(a[0]).localeCompare(String(b[0])));

  const reset=()=>{g.fillStyle="#fff";g.fillRect(0,0,w,h);g.fillStyle="#9aa8b0";g.font="12px sans-serif";g.fillText("Hier unterschreiben",10,h-10);pad.drawn=false;hint=true};
  let drawing=false,last=null,hint=true;const pad={drawn:false,clear:()=>{reset();onDraw&&onDraw()},toBlob:()=>new Promise(r=>c.toBlob(r,"image/png")),toDataURL:()=>c.toDataURL("image/png")};
  g.strokeStyle="#0d1a22";g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";reset();
  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener("pointerdown",e=>{if(hint){g.fillStyle="#fff";g.fillRect(0,h-26,w,26);hint=false}drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)});
  c.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p;if(!pad.drawn){pad.drawn=true;onDraw&&onDraw()}});
  const up=()=>{drawing=false};c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  return pad;
}

/* ---------- Alle Fristen als Kalenderdatei (.ics) mit Erinnerung ----------
   Wartung/Prüfungen, Leitern, Aufträge, Schlüsselrückgaben, Kündigungsfristen, Termine der nächsten 13 Monate.
   Gleiche UID je Frist: erneutes Importieren aktualisiert statt zu verdoppeln (Outlook, Apple Kalender). */
function fristenICS(){
  const e=v=>String(v||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/([,;])/g,"\\$1");
  const fold=l=>{const out=[];let s=l;while(s.length>73){out.push(s.slice(0,73));s=" "+s.slice(73)}out.push(s);return out.join("\r\n")};
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),lim=addMonths(today(),13);
  const items=agendaItems().filter(x=>x.d>=today()&&x.d<=lim);
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FMS//Fristen//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:FMS Fristen"];
  items.forEach(x=>{const d=(x.start||x.d).replace(/-/g,""),nx=(()=>{const [y,m,dd]=(x.end||x.d).split("-").map(Number);return ISO(new Date(y,m-1,dd+1)).replace(/-/g,"")})();
    const o=objs.get(x.lieg),pre=x.type==="Termin"?"P1D":x.type==="Auftrag"?"P2D":"P14D";
    L.push("BEGIN:VEVENT",`UID:fms-${String(x.open+"-"+x.type+(x.type==="Schlüssel"?"-"+x.label:"")).replace(/[^A-Za-z0-9]+/g,"-").slice(0,90)}-${d}@fms`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${nx}`,
      fold(`SUMMARY:${e(x.type+": "+x.label)}`),o?fold(`LOCATION:${e([o.name,o.adresse].filter(Boolean).join(", "))}`):"",fold(`DESCRIPTION:${e("Aus FMS · "+(liegName(x.lieg)||""))}`),"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY",`TRIGGER:-${pre}`,fold(`DESCRIPTION:${e(x.type+": "+x.label)}`),"END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");return {text:L.filter(Boolean).join("\r\n"),n:items.length}}

  const u=URL.createObjectURL(b);const w=window.open(u,"_blank");if(!w){try{await saveFile(name||"Bericht.pdf",b,"application/pdf")}catch(e){}}setTimeout(()=>URL.revokeObjectURL(u),60000)}

/* Kostenübersicht eines Jahres: Auftragskosten (nach Erledigungs-, sonst Erstelldatum) und laufende Vertragskosten */
function costYears(){const ys=new Set([new Date().getFullYear()]);tickets().forEach(([,t])=>{if(num(t.kosten)){const d=(t.abschluss&&t.abschluss.datum)||t.erstellt||"";if(/^\d{4}/.test(d))ys.add(+d.slice(0,4))}});return [...ys].sort((a,b)=>b-a)}
function kostenModel(y){
  const eur=v=>v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const tk=tickets().map(([,t])=>t).filter(t=>t.status!=="storniert"&&num(t.kosten)&&String((t.abschluss&&t.abschluss.datum)||t.erstellt||"").startsWith(String(y)));
  const ys=`${y}-01-01`,ye=`${y}-12-31`;
  const vt=recs("vertraege").map(([,v])=>v).filter(v=>num(v.kosten)&&(!v.beginn||v.beginn<=ye)&&(v.status==="aktiv"||(vtEnde(v)&&vtEnde(v)>=ys)));
  const by={},key=id=>id&&objs.has(id)?id:"_";
  tk.forEach(t=>{const k=key(t.lieg);(by[k]=by[k]||{a:0,n:0,v:0}).a+=num(t.kosten);by[k].n++});
  vt.forEach(v=>{const k=key(v.lieg);(by[k]=by[k]||{a:0,n:0,v:0}).v+=num(v.kosten)});
  const rows=Object.entries(by).map(([k,x])=>({k,name:k==="_"?"ohne / mehrere Liegenschaften":liegName(k),...x,s:x.a+x.v})).sort((a,b)=>b.s-a.s);
  const sum=rows.reduce((a,r)=>({a:a.a+r.a,n:a.n+r.n,v:a.v+r.v,s:a.s+r.s}),{a:0,n:0,v:0,s:0});
  const byK={};tk.forEach(t=>{const k=t.kat||"ohne Gewerk";(byK[k]=byK[k]||{a:0,n:0}).a+=num(t.kosten);byK[k].n++});
  return {title:"Kostenübersicht",sub:`Jahr ${y}`,right:[stand()],blocks:[
    {kv2:[["Auftragskosten",eur(sum.a)],["Aufträge mit Kosten",String(sum.n)],["Vertragskosten (Jahreswerte)",eur(sum.v)],["Summe",{t:eur(sum.s),c:"bold"}]]},
    {h:"Je Liegenschaft"},rows.length?{table:{head:["Liegenschaft","Aufträge","Auftragskosten","Verträge","Summe"],w:[.4,.1,.17,.16,.17],align:["l","r","r","r","r"],sz:8.4,
      rows:[...rows.map(r=>[r.name,String(r.n),eur(r.a),eur(r.v),{t:eur(r.s),c:"bold"}]),{cells:[{t:"Summe",c:"bold"},{t:String(sum.n),c:"bold"},{t:eur(sum.a),c:"bold"},{t:eur(sum.v),c:"bold"},{t:eur(sum.s),c:"bold"}]}]}}:{p:"Keine Kosten erfasst."},
    {h:"Aufträge je Gewerk"},Object.keys(byK).length?{table:{head:["Gewerk","Aufträge","Kosten"],w:[.6,.15,.25],align:["l","r","r"],rows:Object.entries(byK).sort((a,b)=>b[1].a-a[1].a).map(([k,x])=>[k,String(x.n),eur(x.a)])}}:{p:"Keine."},
    {h:"Einzelne Aufträge"},tk.length?{table:{head:["Nr.","Auftrag","Liegenschaft","Erledigt","Kosten"],w:[.12,.38,.24,.12,.14],align:["l","l","l","l","r"],sz:8.2,
      rows:tk.sort((a,b)=>String(a.nr).localeCompare(String(b.nr))).map(t=>[t.nr||"",t.titel||"",liegShort(t.lieg)||"–",fmtDate(t.abschluss?.datum)||"offen",eur(num(t.kosten))])}}:{p:"Keine."},
    {note:"Auftragskosten zählen im Jahr der Erledigung (offene Aufträge im Jahr der Anlage). Vertragskosten: volle Jahreskosten aller Verträge, die im Jahr liefen."}]}}

async function runReport(r,k){
  if(r.startsWith("csv-")){const m=r.slice(4);return exportModCSV(m,recs(m).map(([id,x])=>Object.assign({_id:id},x)).sort(MODS[m].sort))}
  let model;
  if(r==="lieg"){if(!repState.lieg){setSave("err","Bitte zuerst eine Liegenschaft wählen");return}model=liegReportModel(repState.lieg)}
  else if(r==="all")model=allReportModel();
  else if(r==="taetig")model=termReportModel(repState.month);
  else if(r==="kosten")model=kostenModel(+repState.year||new Date().getFullYear());
  else if(r==="quartal"){const [y,q]=repState.quartal.split("-Q").map(Number);model=quartalModel(y,q)}
  const name=r==="lieg"?`Liegenschaftsbericht ${liegName(repState.lieg)}`:r==="all"?`Gesamtübersicht ${today()}`:r==="kosten"?`Kostenübersicht ${repState.year}`:r==="quartal"?`Quartalsübersicht ${repState.quartal}`:`Terminübersicht ${repState.month||"gesamt"}`;
  if(k==="view")return openRepView(model,name);
  return outDoc([model],name,k==="print"?"print":"pdf");
}

async function exportModCSV(m,rows){
  const M=MODS[m],q=v=>{v=String(v??"");return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const L=[M.csv.map(c=>q(c[0])).join(";")];rows.forEach(r=>L.push(M.csv.map(c=>q(typeof c[1]==="function"?c[1](r):r[c[1]])).join(";")));
  try{await saveFile(`${M.label.replace(/[^\wäöüÄÖÜß ]/g,"").trim()} ${today()}.csv`,"﻿"+L.join("\r\n"),"text/csv")}catch(e){}
}

/* ---------- CSV-Export (Excel-tauglich) ---------- */
async function exportCSV(o){
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const L=[];L.push(["Objekt-Nr.",o.nr].map(q).join(";"));L.push(["Liegenschaft",o.name].map(q).join(";"));L.push(["Adresse",o.adresse].map(q).join(";"));
  L.push(["Begehung",fmtDate(o.datum),"von",o.bearbeiter].map(q).join(";"));L.push("");
  SECTIONS.forEach(s=>{L.push(q((s.group==="elektro"?"ELEKTRO – ":"")+s.label.toUpperCase()));L.push(s.cols.map(c=>q(c.l)).join(";"));
    o.rows[s.key].forEach(r=>L.push(s.cols.map(c=>q(c.t==="date"?fmtDate(r[c.k]):c.t==="due"?(nextDue(r)?dueInfo(r).txt:""):c.t==="pstat"?ladStatus(r).txt:c.ol?c.ol[r[c.k]||""]:r[c.k])).join(";")));L.push("")});
  const name=((o.nr?o.nr+" ":"")+(o.name||"Liegenschaft")).replace(/[^\wäöüÄÖÜß\- ]/g,"").trim()||"Liegenschaft";
  try{await saveFile(`${APP_FILE} ${name}.csv`,"\ufeff"+L.join("\r\n"),"text/csv")}
  catch(e){if(e&&e.code!=="declined")setSave("err","Export nicht möglich")}
}

function applySnapshot(snap){
  const seen=new Set();
  snap.docs.forEach(d=>{seen.add(d.id);if(dirty.has(d.id)||writing[d.id])return;objs.set(d.id,norm(JSON.parse(JSON.stringify(d.data()))))});
  [...objs.keys()].forEach(id=>{if(!seen.has(id)&&!dirty.has(id)&&!writing[id])objs.delete(id)});
  if(!active||!objs.has(active))active=sorted()[0]?.[0]||null;
  if(LAD_ONLY&&!snap.metadata.fromCache)ensureBestand();
  renderList();
  const sheet=$("#sheet");
  if(!sheet.contains(document.activeElement))renderSheet(); else refreshLive();
  if(!anyDirty()&&mode==="db")setSave("ok",savedLabel());
  if(typeof onCollChange==="function")onCollChange("objekte");
}
function ensureBestand(){if(!LAD_ONLY)return;if(!objs.has("bestand")){objs.set("bestand",blankObj());schedule("bestand")}active="bestand"}
async function startLocal(){
  mode="local";
  const had=await loadLocal();ensureBestand();
  if(!had&&OFFLINE&&window.BEGEHUNG_SEED){Object.entries(window.BEGEHUNG_SEED).forEach(([k,v])=>objs.set(k,norm(v)));saveLocal()}
  active=sorted()[0]?.[0]||null;renderList();renderSheet();setSave("ok",savedLabel());
  COLLS.forEach(n=>C[n].loaded=true);
  $("#bkExp").hidden=!canSave();
  if(typeof onCollChange==="function")onCollChange("*");
  userRefresh();
  loadBkAt();rpDaily();setTimeout(quartalAuto,6000);
  if(PWA&&navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
  if(OFFLINE)await initFile();
}

/* =====================================================================
   Servermodus (Supabase) – nur aktiv, wenn window.FMS_SERVER gesetzt ist (Build „FMS-Server“).
   Stellt dieselbe Schnittstelle bereit wie der bisherige „db“-Modus: collection(n).doc(id).set/delete und onSnapshot.
   Daten: Tabelle public.records (coll, id, data), Fotos/PDFs: Speicher „fms“. Rechte prüft der Server (siehe supabase-setup.sql).
   ===================================================================== */
const SERVER=!!window.FMS_SERVER;let sb=null,serverEmail="";const signedUrls=new Map();
function errMsg(e){const m=String((e&&(e.message||e.error_description))||e||"");if(/row-level security|permission|42501|403/i.test(m+(e&&e.code)))return "Keine Berechtigung für diese Änderung";
  if(/fetch|network|Failed to fetch|NetworkError/i.test(m))return "Keine Verbindung zum Server – Änderung wird nicht gespeichert";return m||"Fehler"}
function authScreen(){return new Promise(res=>{const el=$("#login");el.hidden=false;document.body.classList.add("locked");let am="in",msg="",busy=false;
  const render=()=>{el.innerHTML=`<div class="lg-box" role="dialog" aria-modal="true" aria-labelledby="auT"><div class="lg-brand">${esc(APP_LABEL)}</div>
    <h1 id="auT">${am==="in"?"Anmelden":am==="up"?"Registrieren":"Passwort vergessen"}</h1>
    <form id="auForm" class="lg-pin" style="max-width:360px;align-items:stretch;text-align:left">
      <label for="auMail">E-Mail</label><input id="auMail" class="gs-in" type="email" autocomplete="username" required value="${esc((document.getElementById("auMail")||{}).value||"")}">
      ${am!=="reset"?`<label for="auPw">Passwort${am==="up"?" (mindestens 8 Zeichen)":""}</label><input id="auPw" class="gs-in" type="password" autocomplete="${am==="up"?"new-password":"current-password"}" required minlength="8">`:""}
      <button class="btn pri" type="submit"${busy?" disabled":""}>${busy?"Bitte warten …":am==="in"?"Anmelden":am==="up"?"Konto anlegen":"Link zum Zurücksetzen schicken"}</button>
      ${msg?`<p class="msg ${msg.split(":")[0]}">${esc(msg.split(/:(.*)/s)[1])}</p>`:""}</form>
    <div class="actions" style="justify-content:center">${am!=="in"?`<button class="btn ghost" type="button" data-au="in">Zur Anmeldung</button>`:`<button class="btn ghost" type="button" data-au="up">Noch kein Konto? Registrieren</button><button class="btn ghost" type="button" data-au="reset">Passwort vergessen</button>`}</div>
    <p class="note">Testversion mit Server (Supabase, Frankfurt). Zugang bekommt nur, wer vom Administrator in FMS mit seiner E-Mail-Adresse eingetragen ist.</p></div>`;
    setTimeout(()=>{const i=$("#auMail");if(i&&!i.value)i.focus();else{const p=$("#auPw");if(p)p.focus()}},30)};
  el.onclick=e=>{const b=e.target.closest("[data-au]");if(!b)return;am=b.dataset.au;msg="";render()};
  el.onsubmit=async e=>{e.preventDefault();if(busy)return;const email=$("#auMail").value.trim(),pw=$("#auPw")?$("#auPw").value:"";busy=true;msg="";render();$("#auMail").value=email;
    try{if(am==="in"){const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;el.onsubmit=el.onclick=null;return res(data.session)}
      if(am==="up"){const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.href.split("#")[0].split("?")[0]}});if(error)throw error;
        if(data.session){el.onsubmit=el.onclick=null;return res(data.session)}msg="ok:Konto angelegt. Bitte den Link in der Bestätigungs-Mail öffnen, dann hier anmelden.";am="in"}
      if(am==="reset"){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0].split("?")[0]});if(error)throw error;msg="ok:Falls die Adresse bekannt ist, kommt gleich eine E-Mail mit einem Link.";am="in"}}
    catch(err){const m=String(err.message||err);msg="err:"+(/invalid login/i.test(m)?"E-Mail oder Passwort stimmt nicht.":/not confirmed/i.test(m)?"Die E-Mail-Adresse ist noch nicht bestätigt – bitte den Link in der Mail öffnen.":/already registered/i.test(m)?"Für diese Adresse gibt es schon ein Konto – bitte anmelden.":/password/i.test(m)&&/6|8|short/i.test(m)?"Das Passwort ist zu kurz.":m)}
    busy=false;render()};
  render()})}
async function startServer(){
  const cfg=window.FMS_SERVER;
  if(!window.supabase||!window.supabase.createClient){setSave("err","Server-Bibliothek fehlt (supabase.min.js)");return}
  sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"fms-server-auth"}});
  sb.auth.onAuthStateChange(async(ev)=>{if(ev==="SIGNED_OUT")location.reload();
    if(ev==="PASSWORD_RECOVERY"){const pw=prompt("Neues Passwort festlegen (mindestens 8 Zeichen):");if(pw&&pw.length>=8){const {error}=await sb.auth.updateUser({password:pw});alert(error?"Fehler: "+error.message:"Passwort geändert.")}}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session)session=await authScreen();
  serverEmail=String(session.user.email||"").toLowerCase();setSave("busy","Daten werden geladen …");
  const store={},listeners={},timers={};
  const emit=n=>{const m=store[n]||new Map();(listeners[n]||[]).forEach(cb=>cb({docs:[...m.entries()].map(([id,d])=>({id,data:()=>d})),metadata:{fromCache:false}}))};
  const loadAll=async()=>{const out=[];for(let from=0;;from+=1000){const {data,error}=await sb.from("records").select("coll,id,data").eq("deleted",false).range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out};
  let rows=[];try{rows=await loadAll()}catch(e){setSave("err","Laden fehlgeschlagen: "+errMsg(e))}
  rows.forEach(r=>{(store[r.coll]=store[r.coll]||new Map()).set(r.id,r.data)});
  sb.channel("fms-records").on("postgres_changes",{event:"*",schema:"public",table:"records"},p=>{const r=(p.new&&p.new.coll)?p.new:p.old;if(!r||!r.coll)return;
    const m=store[r.coll]=store[r.coll]||new Map();if(p.eventType==="DELETE"||r.deleted)m.delete(r.id);else if(r.data)m.set(r.id,r.data);
    clearTimeout(timers[r.coll]);timers[r.coll]=setTimeout(()=>emit(r.coll),60)})
    .subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setSave("err","Live-Verbindung unterbrochen – Änderungen anderer erscheinen erst nach Neuladen");if(st==="SUBSCRIBED"&&!anyDirty())setSave("ok",savedLabel())});
  /* nach Rückkehr in die App (iPad im Hintergrund) neu laden, falls Live-Ereignisse verpasst wurden */
  document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible")return;try{const all=await loadAll();const seen={};all.forEach(r=>{(seen[r.coll]=seen[r.coll]||new Map()).set(r.id,r.data)});
    Object.keys({...store,...seen}).forEach(n=>{store[n]=seen[n]||new Map();emit(n)})}catch(e){}});
  db={collection(n){return {doc(id){id=id||rid();return {id,
      async set(data){const {error}=await sb.from("records").upsert({coll:n,id,data,updated:data&&data.updated||Date.now(),deleted:false,updated_at:new Date().toISOString()});if(error)throw Object.assign(new Error(errMsg(error)),{code:error.code});(store[n]=store[n]||new Map()).set(id,data)},
      async delete(){const {error}=await sb.from("records").update({deleted:true,updated:Date.now(),updated_at:new Date().toISOString()}).eq("coll",n).eq("id",id);if(error)throw Object.assign(new Error(errMsg(error)),{code:error.code});if(store[n])store[n].delete(id)}}},
    onSnapshot(cb){(listeners[n]=listeners[n]||[]).push(cb);setTimeout(()=>emit(n),0)}}}};
  assets={async upload(blob){const ext=blob.type==="application/pdf"?".pdf":blob.type==="image/png"?".png":".jpg",id="s"+rid()+ext;
      const {error}=await sb.storage.from("fms").upload(id,blob,{contentType:blob.type||"application/octet-stream",upsert:false});if(error)throw error;return {id,url:null}},
    async delete(id){await sb.storage.from("fms").remove([id])}};
  mode="db";col=db.collection("objekte");$("#bkExp").hidden=!canSave();
  col.onSnapshot(applySnapshot);
  COLLS.forEach(n=>{C[n].ref=db.collection(n);C[n].ref.onSnapshot(s=>cApply(n,s))});
  setTimeout(quartalAuto,8000)}
async function serverUrl(id){const c=signedUrls.get(id);if(c&&c.t>Date.now())return c.u;const {data,error}=await sb.storage.from("fms").createSignedUrl(id,3600);if(error||!data)return null;signedUrls.set(id,{u:data.signedUrl,t:Date.now()+50*60000});return data.signedUrl}
async function serverLogout(){try{await sb.auth.signOut()}catch(e){}location.reload()}

(async()=>{
  setView(view);
  if(SERVER){await startServer();return}
  const c=window.claude;
  if(!c||!c.use){startLocal();return}
  try{dl=await c.use("downloads")}catch(e){dl=null}
  try{assets=await c.use("assets")}catch(e){assets=null}
  try{db=await c.use("db")}catch(e){db=null}
  if(!db){startLocal();return}
  mode="db";col=db.collection("objekte");
  $("#bkExp").hidden=!canSave();
  col.onSnapshot(applySnapshot,()=>setSave("err","Verbindung unterbrochen – Seite neu laden"));
  COLLS.forEach(n=>{C[n].ref=db.collection(n);C[n].ref.onSnapshot(s=>cApply(n,s),()=>setSave("err","Verbindung unterbrochen – Seite neu laden"))});
})();
})();
</script>
