<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="FMS Test">
<meta name="theme-color" content="#0B6E79"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FMS (Server-Test)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Objektliste links (Prüfbuch-Register), rechts das Blatt der gewählten Liegenschaft mit Reitern je Gewerk */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#F6F8F9; --ink:#15212A; --muted:#5A6A75; --line:#D9E1E5;
  --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#DDEFF1;
  --z1:#2E7D4F; --z1bg:#E1F2E8; --z2:#8A7A12; --z2bg:#F5F0CF; --z3:#B35A12; --z3bg:#FBE5D2; --z4:#B3261E; --z4bg:#F9DCDA;
  --scrim:rgba(15,25,30,.45);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#162027; --sunk:#121B21; --ink:#E4ECF0; --muted:#8C9EA9; --line:#26343D;
  --accent:#4EBFCC; --accent-ink:#06252A; --accent-soft:#163A40;
  --z1:#6FCF97; --z1bg:#173226; --z2:#E0CF5A; --z2bg:#332E12; --z3:#F2A15E; --z3bg:#3A2614; --z4:#F28B82; --z4bg:#3D1C1A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#162027; --sunk:#121B21; --ink:#E4ECF0; --muted:#8C9EA9; --line:#26343D;
  --accent:#4EBFCC; --accent-ink:#06252A; --accent-soft:#163A40;
  --z1:#6FCF97; --z1bg:#173226; --z2:#E0CF5A; --z2bg:#332E12; --z3:#F2A15E; --z3bg:#3A2614; --z4:#F28B82; --z4bg:#3D1C1A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Sidebar */
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 2px 6px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 340px);min-height:160px;overflow:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:10px 12px;border:1px solid transparent;
  border-radius:var(--r);background:transparent;cursor:pointer}
.item:hover{background:var(--surface)}
.item.on{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.item b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{grid-column:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{grid-row:1/3;grid-column:2;align-self:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--z4)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.sidefoot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.datablock{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.filebox{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.filebox b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.filebox .row{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--z1)}
.dot.busy{background:var(--z2)} .dot.err{background:var(--z4)}
/* Status pills */
.pill{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:99px;white-space:nowrap}
.p-offen{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.p-arbeit{background:var(--z2bg);color:var(--z2)}
.p-fertig{background:var(--z1bg);color:var(--z1)}
/* Main sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column}
.head{padding:20px 22px 0;display:flex;flex-direction:column;gap:14px}
.title-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.title-in{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.015em;border:0;background:transparent;padding:0;width:100%;min-width:0}
.title-in::placeholder{color:var(--muted)}
.sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.title-box{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.kpi{padding:10px 12px;min-width:0;background:var(--surface)}
.kpi dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi dd{margin:2px 0 0;font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi.warn dd{color:var(--z3)} .kpi.crit dd{color:var(--z4)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -22px;padding:0 22px;scrollbar-width:none}
.tab{border:0;background:transparent;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.n{font-family:var(--f-mono);font-size:11px;font-weight:400;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:0 6px;color:var(--muted)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;align-self:flex-start;max-width:100%}
.stab{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.stab:hover{color:var(--ink)}
.stab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
/* Grid table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td.idx{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;width:38px;padding:0 4px}
td input,td select{width:100%;border:0;background:transparent;padding:9px 10px;min-width:0;border-radius:0}
td input:focus,td select:focus{outline:none;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
td input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.ro{padding:0 10px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
td.del{width:36px;text-align:center}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{color:var(--z4);background:var(--z4bg)}
tfoot td{background:var(--sunk);font-family:var(--f-mono);font-size:12px;padding:8px 10px;color:var(--muted);text-align:right;border-top:1px solid var(--line)}
.due{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px}
.due.ok{background:var(--z1bg);color:var(--z1)} .due.soon{background:var(--z2bg);color:var(--z2)} .due.over{background:var(--z4bg);color:var(--z4)}
.due.none{color:var(--muted)}
/* Zustand */
select.z{font-weight:600;font-size:12.5px;border-radius:6px;margin:4px 6px;width:calc(100% - 12px);padding:5px 8px;cursor:pointer}
.z1{background:var(--z1bg)!important;color:var(--z1)} .z2{background:var(--z2bg)!important;color:var(--z2)}
.z3{background:var(--z3bg)!important;color:var(--z3)} .z4{background:var(--z4bg)!important;color:var(--z4)}
.z0{color:var(--muted)}
td.ph{width:76px;padding:0 6px}
.phbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px 3px 3px;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:12px;min-height:30px}
.phbtn:hover{border-color:var(--accent);color:var(--ink)}
.phbtn img{width:24px;height:24px;object-fit:cover;border-radius:4px;display:block;background:var(--sunk)}
.phbtn svg{width:16px;height:16px;margin-left:4px}
.phbtn.none{padding:3px 8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:6px;right:6px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb .cf{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:4px}
.thumb .cf .btn{flex:1}
.addph{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;background:var(--sunk);text-align:center;padding:8px}
.addph:hover{border-color:var(--accent);color:var(--ink)}
.addph svg{width:26px;height:26px}
.big{display:flex;flex-direction:column;gap:10px}
.big img{width:100%;max-height:70vh;object-fit:contain;border-radius:var(--r);background:var(--sunk)}
.fotostrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fotostrip img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;padding:6px 0;text-align:left}
.pbtn .pgo{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.pbtn:hover .pgo{text-decoration:underline}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:last-child{border-bottom:0}
.prow .d{font-family:var(--f-mono);font-size:13px}
.prow small{display:block;color:var(--muted);font-size:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meta div{background:var(--sunk);padding:8px 10px;min-width:0}
.meta dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.chk-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ci{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.ci.bad{background:var(--z4bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
.seg label:first-child span{border-left:0}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.seg input:checked+span.io{background:var(--z1bg);color:var(--z1)}
.seg input:checked+span.nio{background:var(--z4bg);color:var(--z4)}
.seg input:checked+span.ent{background:var(--sunk);color:var(--ink)}
.res{display:inline-block;font-weight:600;font-size:12px;padding:2px 8px;border-radius:99px}
.res.io{background:var(--z1bg);color:var(--z1)} .res.nio{background:var(--z4bg);color:var(--z4)} .res.ent{background:var(--sunk);color:var(--muted)}
.sigwrap{display:flex;flex-direction:column;gap:6px}
.sigpad{width:100%;max-width:460px;height:150px;border:1px solid var(--line);border-radius:var(--r);background:#fff;touch-action:none;cursor:crosshair}
.sigimg{max-width:300px;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.ergs{display:flex;flex-direction:column;gap:6px}
.ergs label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.fld .ergs label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.fld .ergs input{width:auto;margin-top:3px}
.ergs label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:8px 10px;background:var(--sunk);border-radius:var(--r)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* Stammdaten */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.fld.wide{grid-column:1/-1}
.fld.span2{grid-column:span 2}
.fld textarea{min-height:90px;resize:vertical}
.maprow{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);align-items:center}
.legend .pill{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12px;font-weight:600}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ov{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);cursor:pointer;text-align:left}
.ov:hover{border-color:var(--accent)}
.ov h3{margin:0;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:baseline}
.ov h3 span{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block}
.ov small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.note{font-size:12px;color:var(--muted)}
.blank{padding:60px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.blank h2{font-family:var(--f-display);color:var(--ink);margin:0;font-size:20px}
.blank .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* Import */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:880px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);min-width:0}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0}
.dlg-h p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
.paste{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);font-family:var(--f-mono);font-size:12px;resize:vertical}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.map select{padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);width:100%}
.prev table{min-width:560px}
.prev td{padding:7px 10px;font-size:13px}
.prev tr.dup td{color:var(--muted);text-decoration:line-through}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.msg{font-size:13px}

/* Prüffristen ortsveränderliche Geräte */
function nextDue(r){
  if(!r.pr||!r.frist)return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r.pr);if(!m)return null;
  const d=new Date(+m[1],+m[2]-1+ +r.frist,+m[3]);
  return d;
}
function dueInfo(r){
  const d=nextDue(r);
  if(!d)return {cls:"none",txt:r.frist&&!r.pr?"Datum fehlt":"–"};
  const now=new Date();now.setHours(0,0,0,0);
  const days=Math.round((d-now)/864e5);
  const txt=`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
  if(days<0)return {cls:"over",txt:txt+" · überfällig",state:"over"};
  if(days<=60)return {cls:"soon",txt:txt+` · in ${days} T.`,state:"soon"};
  return {cls:"ok",txt,state:"ok"};
}

/* ---------- Kennzahlen ---------- */
function stats(o){
  const r=new Proxy(o.rows,{get:(t,k)=>t[k]||[]}), all=SECTIONS.filter(hasZ).flatMap(s=>r[s.key]);
  const z=[0,0,0,0,0]; all.forEach(x=>{z[+x.zustand||0]++});
  const omgDue=r.omg.filter(x=>dueInfo(x).state==="over").length;
  const lad=[...r.leiter,...r.tritt].filter(x=>ladStatus(x).state!=="out");
  const ladDue=lad.filter(x=>["over","missing","locked"].includes(ladStatus(x).state)).length;
  return {
    uv:r.uv.length, sich:r.uv.reduce((a,x)=>a+num(x.sich),0), fi:r.uv.reduce((a,x)=>a+num(x.fi),0),
    leuchten:r.licht.reduce((a,x)=>a+num(x.anz),0), omg:r.omg.reduce((a,x)=>a+num(x.anz),0), omgDue, sonder:r.sonder.length,
    tueren:r.bst.length, maengel:z[3]+z[4], dringend:z[4], lad:lad.length, ladDue
  };
}

/* ---------- Speichern ---------- */
function setSave(state,txt){const d=$("#dot");d.className="dot"+(state==="busy"?" busy":state==="err"?" err":"");$("#saveTxt").textContent=txt}
function savedLabel(){return mode==="db"?"Gespeichert · in der Cloud":OFFLINE?(PWA?"Gespeichert · auf diesem Gerät":"Gespeichert · auf diesem PC"):"Gespeichert · nur in diesem Browser"}
function schedule(id){dirty.add(id);objs.get(id).updated=Date.now();clearTimeout(timers[id]);setSave("busy","Änderungen werden gespeichert …");
  timers[id]=setTimeout(()=>flush(id),650)}
async function flush(id){
  if(writing[id]){again[id]=true;return}
  writing[id]=true;dirty.delete(id);
  const o=objs.get(id);
  try{
    if(o){ if(mode==="db") await col.doc(id).set(JSON.parse(JSON.stringify(o))); else saveLocal(); }
    if(!dirty.size)setSave("ok",savedLabel());
  }catch(e){
    setSave("err",e&&e.code==="quota_exceeded"?"Speicher voll – bitte alte Objekte löschen":(SERVER?errMsg(e):"Speichern fehlgeschlagen – Eingabe wiederholen"));
    dirty.add(id);serverRetry("obj:"+id,()=>{if(dirty.has(id))flush(id)});
  }
  writing[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}
/* ---------- Weitere Sammlungen (FMS-Module) ---------- */
const COLLS = LAD_ONLY?["historie"]:["auftraege","wartung","anlagen","schluessel","taetig","vertraege","zaehler","benutzer","historie"];
const C={};COLLS.forEach(n=>C[n]={map:new Map(),dirty:new Set(),timers:{},writing:{},again:{},ref:null});
const clone=x=>JSON.parse(JSON.stringify(x));
function cTouch(n,id){const c=C[n],r=c.map.get(id);if(r)r.updated=Date.now();c.dirty.add(id);clearTimeout(c.timers[id]);
  setSave("busy","Änderungen werden gespeichert …");c.timers[id]=setTimeout(()=>cFlush(n,id),500)}
/* Servermodus: fehlgeschlagenes Speichern (kurz kein Netz, Reihenfolge beim Einrichten) einige Male wiederholen */
const retryCnt=new Map();
function serverRetry(key,fn){if(!(typeof SERVER!=="undefined"&&SERVER))return;const k=(retryCnt.get(key)||0)+1;retryCnt.set(key,k);if(k>6)return;setTimeout(fn,Math.min(30000,2000*k))}
async function cFlush(n,id){
  const c=C[n];if(c.writing[id]){c.again[id]=true;return}
  c.writing[id]=true;c.dirty.delete(id);
  try{const r=c.map.get(id);
    if(mode==="db"){if(r)await c.ref.doc(id).set(clone(r));else await c.ref.doc(id).delete()}else saveLocal();
    if(!anyDirty())setSave("ok",savedLabel())}
  catch(e){setSave("err",e&&e.code==="quota_exceeded"?"Speicher voll":(SERVER?errMsg(e):"Speichern fehlgeschlagen – Eingabe wiederholen"));c.dirty.add(id);serverRetry(n+":"+id,()=>{if(C[n].dirty.has(id))cFlush(n,id)})}
  c.writing[id]=false;if(c.again[id]){c.again[id]=false;cFlush(n,id)}
}
function cRemove(n,id){C[n].map.delete(id);cTouch(n,id)}
function anyDirty(){return dirty.size||COLLS.some(n=>C[n].dirty.size)}
function cApply(n,snap){const c=C[n],seen=new Set();
  snap.docs.forEach(d=>{seen.add(d.id);if(c.dirty.has(d.id)||c.writing[d.id])return;c.map.set(d.id,clone(d.data()))});
  [...c.map.keys()].forEach(id=>{if(!seen.has(id)&&!c.dirty.has(id)&&!c.writing[id])c.map.delete(id)});
  c.loaded=!snap.metadata.fromCache;
  if(typeof onCollChange==="function")onCollChange(n);
}
function flushAllNow(){
  if(!anyDirty())return;
  if(mode==="local"){Object.keys(timers).forEach(k=>clearTimeout(timers[k]));dirty.clear();COLLS.forEach(n=>{Object.keys(C[n].timers).forEach(k=>clearTimeout(C[n].timers[k]));C[n].dirty.clear()});saveLocal();setSave("ok",savedLabel())}
  else{[...dirty].forEach(id=>{clearTimeout(timers[id]);flush(id)});COLLS.forEach(n=>[...C[n].dirty].forEach(id=>{clearTimeout(C[n].timers[id]);cFlush(n,id)}))}
}
window.addEventListener("pagehide",flushAllNow);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAllNow()});
function collsPayload(){return Object.fromEntries(COLLS.map(n=>[n,Object.fromEntries(C[n].map)]))}

/* Wiederherstellen aus der Historie */
function histRestore(hid){
  if(!can("restore"))return denied("Wiederherstellen dürfen nur Verwaltung und Administratoren.");
  const h=C.historie.map.get(hid);if(!h||!h.snap||h.restored)return;const s=h.snap;
  if(s.type==="rec"){if(!C[s.m])return;let id=s.id;if(C[s.m].map.has(id))id=newRecId(s.m);C[s.m].map.set(id,clone(s.data));cTouch(s.m,id)}
  else if(s.type==="row"){const o=objs.get(s.obj);if(!o){setSave("err","Die zugehörige Liegenschaft fehlt. Stelle zuerst die Liegenschaft wieder her.");return}
    const rows=o.rows[s.sec]||(o.rows[s.sec]=[]);const d=clone(s.data);if(rows.some(x=>x.id===d.id))d.id=rid();rows.splice(Math.min(s.index,rows.length),0,d);schedule(s.obj)}
  else if(s.type==="obj"){let id=s.id;if(objs.has(id))id=newId();objs.set(id,norm(clone(s.data)));schedule(id)}
  else if(s.type==="doc"){const o=objs.get(s.obj),t=o&&(s.sec==="_obj"?o:(o.rows[s.sec]||[]).find(r=>r.id===s.rid));if(!t){setSave("err","Der zugehörige Eintrag fehlt. Stelle ihn zuerst wieder her.");return}
    t.docs=(t.docs||[]).filter(z=>z.id!==s.data.id).concat(clone(s.data));schedule(s.obj)}
  else return;
  h.restored=Date.now();cTouch("historie",hid);
  histAdd({act:"wiederhergestellt",area:h.area,label:h.label,lieg:h.lieg,liegName:h.liegName,note:"aus der Historie"});
  renderList();renderSheet();renderHist();if(typeof onCollChange==="function")onCollChange("*");setSave("ok","Wiederhergestellt: "+h.label);
}

    r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();idbP=null};d.onclose=()=>{idbP=null};res(d)};r.onerror=()=>rej(r.error)});

/* Schreiben mit Fehlermeldung (für die Hauptdaten); bei geschlossener Verbindung (Safari im Hintergrund) einmal neu verbinden */
async function idbPut(store,k,v,retry){
  try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
  catch(e){if(!retry&&e&&e.name==="InvalidStateError"){idbP=null;return idbPut(store,k,v,true)}throw e}
}
async function idbGet(store,k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction(store).objectStore(store).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(store,k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction(store,"readwrite");v===undefined?t.objectStore(store).delete(k):t.objectStore(store).put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}
async function idbKeys(store){try{const d=await idb();return await new Promise(r=>{const q=d.transaction(store).objectStore(store).getAllKeys();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return []}}

let assets=null;
const urlCache=new Map();
function fotosOn(){return OFFLINE||mode==="local"||!!assets}
async function shrink(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.8));
  }catch(e){return file}
}
const IMG={
  async put(blob,id){
    if(mode==="db"){const r=await assets.upload(blob);if(r.url)urlCache.set(r.id,r.url);return r.id}
    id=id||("f"+rid());await idbSet("img",id,blob);await writeFotoToDir(id,blob);return id;
  },
  async add(file){return IMG.put(await shrink(file))},
  async url(id){
    if(mode==="db"&&SERVER)return await serverUrl(id);
    if(urlCache.has(id))return urlCache.get(id);
    if(mode==="db"){const u="/_blob/"+id;urlCache.set(id,u);return u}
    let b=await idbGet("img",id);
    if(!b){b=await readFotoFromDir(id);if(b)await idbSet("img",id,b)}
    if(!b)return null;const u=URL.createObjectURL(b);urlCache.set(id,u);return u;
  },
  async blob(id){
    if(mode==="db"){try{const r=await fetch(await IMG.url(id));return r.ok?await r.blob():null}catch(e){return null}}
    return (await idbGet("img",id))||(await readFotoFromDir(id));
  },
  async del(id){
    urlCache.delete(id);
    if(mode==="db"){try{await assets.delete(id)}catch(e){}return}
    await idbSet("img",id,undefined);await removeFotoFromDir(id);
  }
};

function canSave(){return !!dl||!window.claude}
async function saveFile(filename,data,type){
  if(dl)return dl.save({filename,data});
  if(OFFLINE&&window.showSaveFilePicker){
    const ext=filename.split(".").pop();
    let h;try{h=await window.showSaveFilePicker({suggestedName:filename,types:[{description:ext.toUpperCase()+"-Datei",accept:{[type]:["."+ext]}}]})}catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};h=null}
    if(h){const w=await h.createWritable();await w.write(new Blob([data],{type}));await w.close();return}
  }
  if(PWA&&navigator.canShare){try{const f=new File([data],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}}
  const ascii=filename.replace(/[äöüÄÖÜß]/g,c=>({"ä":"ae","ö":"oe","ü":"ue","Ä":"Ae","Ö":"Oe","Ü":"Ue","ß":"ss"}[c]));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=ascii;

function walkMedia(x,fn){if(Array.isArray(x)){x.forEach(y=>walkMedia(y,fn));return}if(!x||typeof x!=="object")return;
  for(const k of Object.keys(x)){const v=x[k];if((k==="fotos"||k==="docs")&&Array.isArray(v))fn("foto",x,k);else if(k==="sig"&&typeof v==="string"&&v)fn("sig",x,k);else walkMedia(v,fn)}}

/* ---------- Abgleich iPad ⇄ PC über eine gemeinsame Datei in iCloud Drive ----------
   PC (Edge/Chrome mit Datenordner in iCloud Drive): liest und schreibt „FMS-Abgleich.json“ automatisch.
   iPad: Knopf „Abgleichen“ – Datei wählen (zusammenführen), danach den eigenen Stand dorthin zurückspeichern. */
const SYNC_NAME=APP_FILE+"-Abgleich.json",SYNC_KEY=APP_ID+"-abgleich";
let syncAt=0;try{syncAt=+localStorage.getItem(SYNC_KEY)||0}catch(e){}
function markSync(){syncAt=Date.now();try{localStorage.setItem(SYNC_KEY,String(syncAt))}catch(e){}}
function syncWhen(){if(!syncAt)return "noch nie";const d=new Date(syncAt),t=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===new Date().toDateString()?"heute "+t:d.toLocaleDateString("de-DE")+" "+t}
const fotoURLCache=new Map();
async function addPhotosTo(d,progress){d.bilder={};const ids=allFotoIds();let i=0;
  for(const id of ids){i++;if(progress)progress(i,ids.length);let u=fotoURLCache.get(id);
    if(!u){const b=await IMG.blob(id);if(b){u=await toDataURL(b);if(u)fotoURLCache.set(id,u)}}if(u)d.bilder[id]=u}
  return d}
async function syncApply(d,noBase){
  if(!d||d.app!==APP_ID||!d.objekte)throw new Error("format");
  for(const [id,u] of Object.entries(d.bilder||{})){if(await idbGet("img",id))continue;try{const b=await (await fetch(u)).blob();await IMG.put(b,id)}catch(e){}}
  const plan=mergePlan(d,!noBase);
  for(const op of plan.ops){if(op.kind==="obj"){if(op.op==="del")objs.delete(op.id);else objs.set(op.id,norm(clone(op.data)))}
    else{const c=C[op.n];if(!c)continue;if(op.op==="del")c.map.delete(op.id);else c.map.set(op.id,clone(op.data))}}
  if(!noBase)setSyncBase(d);
  if(plan.ops.length){fixTicketNumbers();saveLocal();if(!active||!objs.has(active))active=sorted()[0]?.[0]||null;renderList();
    if(!$("#sheet").contains(document.activeElement))renderSheet();if(typeof onCollChange==="function")onCollChange("*")}
  return plan.cnt}
const cntTxt=c=>c.neu||c.upd||c.del?`${c.neu} neu, ${c.upd} aktualisiert${c.del?`, ${c.del} gelöscht`:""}`:"Alles schon aktuell";

/* Wie viele Fotos/Unterschriften/Unterlagen sind in den Daten erwähnt, aber auf diesem Gerät nicht vorhanden? */
async function missingMedia(){if(mode!=="local")return 0;let n=0;for(const id of allFotoIds()){if(!(await idbGet("img",id))&&!(await readFotoFromDir(id)))n++}return n}
/* PC: automatisch */
let syncSeen=0,syncTimer=null,syncBusy=false,syncErr="",syncLastKey="";
function syncAuto(){return FS_OK&&mode==="local"&&dirReady()}
function syncIsBusy(){const a=document.activeElement;return !$("#imp").hidden||!$("#cdel").hidden||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file")}
async function syncPull(){let f;try{f=await (await dirHandle.getFileHandle(SYNC_NAME)).getFile()}catch(e){return}
  if(f.lastModified<=syncSeen)return;
  const cnt=await syncApply(JSON.parse(await f.text()));syncSeen=f.lastModified;markSync();
  if(cnt.neu||cnt.upd||cnt.del)setSave("ok","Vom iPad übernommen: "+cntTxt(cnt))}
async function syncPush(){const d=snapshotData();const key=JSON.stringify({...d,savedAt:0,ids:allFotoIds()});if(key===syncLastKey)return;
  await addPhotosTo(d);const fh=await dirHandle.getFileHandle(SYNC_NAME,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(d));await w.close();
  syncLastKey=key;syncSeen=(await fh.getFile()).lastModified;markSync()}
async function syncNow(force){if(!syncAuto()||syncBusy)return;if(!force&&syncIsBusy()){syncLater(15000);return}
  syncBusy=true;try{await syncPull();await syncPush();syncErr=""}
  catch(e){syncErr=e&&e.message==="format"?"„"+SYNC_NAME+"“ ist beschädigt oder gehört nicht zu dieser App.":"„"+SYNC_NAME+"“ konnte nicht gelesen oder geschrieben werden."}
  syncBusy=false;renderFileBox()}
function syncLater(ms){if(!syncAuto())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),ms||20000)}
window.addEventListener("focus",()=>{if(syncAuto())syncNow(false)});
setInterval(()=>{if(syncAuto()&&document.visibilityState==="visible")syncNow(false)},60000);

        ${s.cnt?`<p style="margin:0"><b>${esc(cntTxt(s.cnt))}</b></p>`:""}

      <div class="signbox${s.saved?" done":""}"><h3>2. Stand des iPads zurückspeichern</h3>
        <p class="note" style="margin:0">Im Teilen-Menü „In Dateien sichern“ wählen → iCloud Drive › ${APP_FILE} → die vorhandene Datei <b>ersetzen</b>. Der PC übernimmt den Stand dann automatisch.</p>
        <div class="actions"><button class="btn${s.cnt&&!s.saved?" pri":""}" type="button" data-sy="save"${s.busy?" disabled":""}>${s.busy==="save"?"Wird vorbereitet …":s.saved?"Nochmals speichern":"In iCloud Drive speichern"}</button></div></div>
      ${s.msg?`<div class="msg ${s.msg.split(":")[0]}">${esc(s.msg.split(/:(.*)/s)[1])}</div>`:""}
    </div>
    <div class="dlg-f"><span></span><div class="actions"><button class="btn pri" type="button" data-sy="close">Fertig</button></div></div></div>`}
async function syClick(e){const b=e.target.closest("[data-sy]");if(!b||!syDlg)return;const s=syDlg;
  if(b.dataset.sy==="close"){if(s.busy)return;syDlg=null;return closeImport()}
  if(b.dataset.sy==="save"){s.busy="save";s.msg="";renderSync();
    try{const d=await addPhotosTo(snapshotData(),(i,n)=>{if(n>5&&i%5===0){s.msg=`busy:Fotos ${i} von ${n} …`;renderSync()}});s.msg="";
      await saveFile(SYNC_NAME,JSON.stringify(d),"application/json");s.saved=true;markSync();markBackup();const miss=allFotoIds().length-Object.keys(d.bilder).length;
      s.msg=miss>0?`err:Gespeichert, aber ${miss} Foto${miss>1?"s":""}/Unterschrift${miss>1?"en":""} fehlen auf diesem Gerät und sind nicht in der Datei.`:"ok:Gespeichert. Der Stand ist jetzt auch eine Sicherung."}
    catch(err){s.msg=err&&err.code==="declined"?"":"err:Speichern nicht möglich."}
    s.busy="";if(syDlg===s)renderSync()}}
document.addEventListener("change",async e=>{if(e.target.id!=="syFile"||!syDlg)return;const s=syDlg,f=e.target.files[0];e.target.value="";if(!f)return;

    const miss=await missingMedia();if(miss)s.msg=`err:Achtung: ${miss} Foto${miss>1?"s":""}/Unterschrift${miss>1?"en":""} fehlen auf diesem Gerät. ${/daten/i.test(f.name)?"Die gewählte Datei „"+f.name+"“ enthält keine Bilder – bitte „"+SYNC_NAME+"“ wählen.":"Bitte am PC einmal „Jetzt abgleichen“ und dann hier erneut die Datei „"+SYNC_NAME+"“ wählen."}`}
  catch(err){s.msg=`err:Diese Datei ist keine ${APP_LABEL}-Abgleich- oder Sicherungsdatei.`}
  s.busy="";if(syDlg===s)renderSync()});
document.addEventListener("click",e=>{if(e.target.closest('[data-sy="open"]'))openSync()});

function cellHTML(c,row,ri,sk){

  if(c.t==="z") return `<td><select class="z z${v||0}" ${a}>${ZUST.map(z=>`<option value="${z[0]}"${String(v)===z[0]?" selected":""}>${z[1]}</option>`).join("")}</select></td>`;
  if(c.t==="sel") return `<td><select ${a}>${c.o.map(x=>`<option value="${esc(x)}"${String(v)===x?" selected":""}>${esc(c.ol?c.ol[x]:(x||"–"))}</option>`).join("")}</select></td>`;
  if(c.t==="num") return `<td><input class="num" inputmode="numeric" ${a} value="${esc(v)}" placeholder="0"></td>`;
  if(c.t==="date") return `<td><input type="date" ${a} value="${esc(v)}"></td>`;
  if(c.t==="pstat"){const st=ladStatus(row),bu=row.bearb&&typeof uName==="function"?C.benutzer.map.get(row.bearb):null;return `<td class="ro"><button type="button" class="pbtn" data-act="pruef" data-sec="${sk}" data-rid="${row.id}"><span class="due ${st.cls}">${st.txt}</span>${bu?`<span class="av sm" style="background:${esc(bu.farbe||U_FARBEN[0])}" title="übernommen von ${esc(bu.name)}">${esc(initials(bu))}</span>`:""}<span class="pgo">${st.state==="missing"?"Erstprüfung":"Prüfen"} ›</span></button></td>`}
  if(c.t==="due"){const d=dueInfo(row);return `<td class="ro" id="due-${row.id}"><span class="due ${d.cls}">${d.txt}</span></td>`}
  return `<td><input ${a} value="${esc(v)}" placeholder="${esc(c.ph||"")}"${c.list?' list="liegList"':c.dl?` list="dl-${c.k}"`:""}></td>`;
}

const IMP_FIELDS=[

  {k:"name",l:"Name / Bezeichnung",re:/liegenschaft|objekt(?!.*nr)|bezeichnung|name|gebäude|gebaeude|standort/i},

  {k:"ort",l:"Ort",re:/^ort$|stadt|gemeinde|^ort\b/i},
  {k:"nutzung",l:"Nutzung",re:/nutzung|nutzungsart|gebäudeart|objektart|typ/i},

let imp={rows:[],head:[],map:{},skipDup:true,msg:"",busy:false};
function openImport(){imp={rows:[],head:[],map:{},skipDup:true,msg:"",busy:false};$("#imp").hidden=false;renderImport();}
function closeImport(){scanStop();$("#imp").hidden=true;$("#imp").innerHTML="";restore=null;rpDlg=null;gs=null;lbl=null;syDlg=null;mq=null;ud=null;rv=null;tplState=null;histDlg=false;mailImp=null;termImp=null;if(docDlg){docDlg.pages.forEach(p=>URL.revokeObjectURL(p.url));docDlg=null;renderSheet()}if(recDlg){finishNew();recDlg=null;afterRec();return}if(photo||pr){photo=null;pr=null;renderSheet()}}
function guessMap(head){
  const map={},used=new Set();
  IMP_FIELDS.forEach(f=>{const i=head.findIndex((h,ix)=>!used.has(ix)&&f.re.test(String(h).trim()));if(i>=0){map[f.k]=i;used.add(i)}});
  if(map.name==null){const i=head.findIndex((h,ix)=>!used.has(ix));if(i>=0)map.name=i}
  return map;
}
function setTable(aoa){
  aoa=aoa.map(r=>r.map(c=>c==null?"":String(c).trim())).filter(r=>r.some(c=>c!==""));
  if(!aoa.length){imp.msg="err:In der Tabelle wurden keine Zeilen gefunden.";renderImport();return}
  let h=0;for(let i=0;i<Math.min(aoa.length,10);i++){if(aoa[i].filter(Boolean).length>=2){h=i;break}}
  imp.head=aoa[h].map((c,i)=>c||`Spalte ${i+1}`);imp.rows=aoa.slice(h+1);imp.map=guessMap(imp.head);imp.msg="";renderImport();
}
function parseText(t){
  const lines=t.replace(/\r/g,"").split("\n");
  const sep=lines[0].includes("\t")?"\t":(lines[0].split(";").length>=lines[0].split(",").length?";":",");
  return lines.map(l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=""}else cur+=ch}
    out.push(cur);return out});
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function readFile(file){
  imp.msg="busy:Datei wird gelesen …";renderImport();
  try{
    if(/\.(xlsx|xlsm|xls|ods)$/i.test(file.name)){
      const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];setTable(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}));
    }else{let txt=await file.text();if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);setTable(parseText(txt))}
  }catch(e){imp.msg="err:Die Datei ließ sich nicht lesen. Speichere sie als .xlsx oder .csv und versuche es erneut.";renderImport()}
}
function impObjects(){
  const m=imp.map,g=(r,k)=>m[k]!=null?(r[m[k]]||"").trim():"";
  return imp.rows.map(r=>{
    const plzOrt=[g(r,"plz"),g(r,"ort")].filter(Boolean).join(" ");
    const adresse=[g(r,"strasse"),plzOrt].filter(Boolean).join(", ");
    return {nr:g(r,"nr"),name:g(r,"name"),adresse,nutzung:g(r,"nutzung"),baujahr:g(r,"baujahr")};
  }).filter(o=>o.name||o.adresse||o.nr);
}

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function initSig(){
  const c=$("#sig");if(!c)return;const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);g.fillStyle="#fff";g.fillRect(0,0,w,h);
  g.strokeStyle="#0d1a22";g.lineWidth=2.2;g.lineCap="round";g.lineJoin="round";
  g.fillStyle="#9aa8b0";g.font="12px sans-serif";g.fillText("Hier unterschreiben",10,h-10);

  c.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p;if(!pr.sigDrawn){pr.sigDrawn=true;prReady()}});

function bestandModel(){

function pruefClick(e){

  if(a==="new"){let def={pruefer:"",quali:"zur Prüfung befähigte Person (BetrSichV § 2 Abs. 6)"};try{Object.assign(def,JSON.parse(localStorage.getItem("begehung-pruefer")||"{}"))}catch(e){}if(meName())def.pruefer=meName();
    pr.d={art:(r.pruef||[]).some(p=>p.done)?"regel":"erst",datum:today(),pruefer:def.pruefer,quali:def.quali,items:{},bem:"",mass:"",erg:"",plakette:false};pr.view="new";return renderPruef()}

    if(a==="ltakeover"&&!confirm(`Von ${prev||"der anderen Person"} übernehmen?\n\nBitte vorher kurz absprechen.`))return;
    r.bearb=me;r.bearbAm=Date.now();schedule(pr.obj);histAdd(Object.assign({act:prev?"übernommen":"angenommen",note:prev?"vorher "+prev:"Prüfung"},rowInfo(pr.obj,pr.sec,r)));refreshLive();return renderPruef()}
  if(a==="lrelease"){if(r.bearb!==me)return;delete r.bearb;delete r.bearbAm;schedule(pr.obj);histAdd(Object.assign({act:"abgegeben",note:"Prüfung"},rowInfo(pr.obj,pr.sec,r)));refreshLive();return renderPruef()}

async function shrinkDoc(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const s=Math.min(1,2200/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85))}catch(e){return file}}
async function docAddPages(files){
  files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name));if(!files.length)return;
  docDlg.busy=`Bereite ${files.length} Seite${files.length>1?"n":""} vor …`;docDlg.msg="";renderDocs();
  for(const f of files){const b=await shrinkDoc(f);docDlg.pages.push({blob:b,url:URL.createObjectURL(b)})}
  docDlg.busy="";renderDocs();
}
async function imagesToPDF(blobs,title){
  const L=await loadPDFLib(),doc=await L.PDFDocument.create();doc.setTitle(title);doc.setCreator(APP_LABEL);
  for(const b of blobs){const bytes=await b.arrayBuffer();let im;try{im=await doc.embedJpg(bytes)}catch(e){im=await doc.embedPng(bytes)}
    const land=im.width>im.height*1.15,W=land?841.89:595.28,H=land?595.28:841.89,M=18,sc=Math.min((W-2*M)/im.width,(H-2*M)/im.height),pg=doc.addPage([W,H]);
    pg.drawImage(im,{x:(W-im.width*sc)/2,y:(H-im.height*sc)/2,width:im.width*sc,height:im.height*sc})}
  return new Blob([await doc.save()],{type:"application/pdf"});
}
function docAttach(entry){const ctx={obj:docDlg.obj,sec:docDlg.sec,rid:docDlg.rid};const o=objs.get(ctx.obj);if(!o)return;
  const t=ctx.sec==="_obj"?o:(o.rows[ctx.sec]||[]).find(r=>r.id===ctx.rid);if(!t)return;
  t.docs=(t.docs||[]).concat(entry);schedule(ctx.obj);
  histAdd(Object.assign({act:"Unterlage hinzugefügt",note:entry.name},ctx.sec==="_obj"?objInfo(ctx.obj,o):rowInfo(ctx.obj,ctx.sec,t)))}
async function docSave(){
  const d=docDlg,name=(d.name||"").trim()||`Dokument ${new Date().toLocaleDateString("de-DE")}`;
  d.busy="PDF wird erstellt …";renderDocs();
  try{const pdf=await imagesToPDF(d.pages.map(p=>p.blob),name);const id=await IMG.put(pdf,"d"+rid());
    docAttach({id,name,pages:d.pages.length,size:pdf.size,t:Date.now(),src:"foto"});
    d.pages.forEach(p=>URL.revokeObjectURL(p.url));d.pages=[];d.name="";d.mode="list";d.busy="";d.msg="";renderDocs();setSave("ok",`„${name}“ als PDF gespeichert`)}
  catch(e){d.busy="";d.msg=window.PDFLib?"Das PDF konnte nicht erstellt werden.":"Für die erste PDF-Erstellung wird einmal Internet benötigt.";renderDocs()}
}
async function docAddPdfs(files){
  files=files.filter(f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name));if(!files.length)return;
  for(const f of files){docDlg.busy=`Speichere ${f.name} …`;renderDocs();
    try{const blob=new Blob([await f.arrayBuffer()],{type:"application/pdf"});const id=await IMG.put(blob,"d"+rid());
      docAttach({id,name:f.name.replace(/\.pdf$/i,""),size:blob.size,t:Date.now(),src:"pdf"})}
    catch(e){docDlg.msg=e&&e.code==="quota_exceeded"?"Der Speicher ist voll.":`${f.name} konnte nicht gespeichert werden.`}}
  docDlg.busy="";renderDocs();
}
async function docOpen(id){
  const t=docTarget(),x=(t.docs||[]).find(z=>z.id===id);if(!x)return;
  const b=await IMG.blob(id);if(!b){docDlg.msg="Die Datei wurde auf diesem Gerät nicht gefunden.";return renderDocs()}
  const pdf=b.type==="application/pdf"?b:new Blob([b],{type:"application/pdf"});
  if(OFFLINE&&!PWA){const a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);return}
  try{await saveFile(x.name.replace(/[\\/:*?"<>|]/g,"-")+".pdf",new Uint8Array(await pdf.arrayBuffer()),"application/pdf")}catch(e){}
}
function docDelete(id){
  const t=docTarget(),x=(t.docs||[]).find(z=>z.id===id);if(!x)return;const info=docInfo(),ctx={obj:docDlg.obj,sec:docDlg.sec,rid:docDlg.rid};
  confirmDelete({title:"Unterlage",label:x.name,lines:[`${info.area}: ${info.label}`,info.liegName],onConfirm:grund=>{
    const o=objs.get(ctx.obj),tt=ctx.sec==="_obj"?o:o&&(o.rows[ctx.sec]||[]).find(r=>r.id===ctx.rid);if(!tt)return;
    tt.docs=(tt.docs||[]).filter(z=>z.id!==id);schedule(ctx.obj);
    histAdd(Object.assign({},info,{act:"gelöscht",label:`Unterlage „${x.name}“ · ${info.label}`,grund,snap:{type:"doc",obj:ctx.obj,sec:ctx.sec,rid:ctx.rid,data:clone(x)}}));
    if(docDlg)renderDocs();setSave("ok","Gelöscht, Kopie in der Historie")}});
}
function docClick(e){const b=e.target.closest("[data-dc]");if(!b)return;const a=b.dataset.dc,d=docDlg;
  if(a==="close"){d.pages.forEach(p=>URL.revokeObjectURL(p.url));return closeImport()}
  if(a==="new"){d.mode="new";d.msg="";return renderDocs()}
  if(a==="list"){d.pages.forEach(p=>URL.revokeObjectURL(p.url));d.pages=[];d.mode="list";return renderDocs()}
  if(a==="pdel"){const [p]=d.pages.splice(+b.dataset.i,1);if(p)URL.revokeObjectURL(p.url);return renderDocs()}
  if(a==="up"||a==="down"){const i=+b.dataset.i,j=a==="up"?i-1:i+1;[d.pages[i],d.pages[j]]=[d.pages[j],d.pages[i]];return renderDocs()}
  if(a==="save")return docSave();
  if(a==="open")return docOpen(b.dataset.id);
  if(a==="del")return docDelete(b.dataset.id);
}

let restore=null;
/* ---------- Zusammenführen beim Abgleich (feldgenau) ----------
   „Basis“ = der Stand, den dieses Gerät beim letzten Abgleich von der anderen Seite übernommen hat.
   Je Feld: nur hier geändert → bleibt; nur dort geändert → wird übernommen; auf beiden Seiten geändert → der neuere Datensatz gewinnt.
   Listen wie Verlauf, Durchführungen, Zählerstände, Ausgaben, Fotos, Prüfprotokolle werden vereint statt ersetzt. */
let syncBase=null;
const jEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const UNION={log:x=>(x.at||"")+"|"+(x.t||""),hist:x=>(x.datum||"")+"|"+(x.von||"")+"|"+(x.bem||""),staende:x=>x.id,ausgaben:x=>x.id,fotos:x=>x.id,docs:x=>x.id,pruef:x=>x.id,abschlussAlt:x=>(x.at||"")+"|"+(x.name||"")};
function mergeArr(k,la,ia,ba,preferI){const key=UNION[k],m=new Map(),bm=new Map((ba||[]).map(x=>[key(x),x])),lk=new Set(la.map(key)),ik=new Set(ia.map(key));
  la.forEach(x=>m.set(key(x),x));
  ia.forEach(x=>{const kk=key(x);if(!m.has(kk)){m.set(kk,x);return}const l=m.get(kk),b=bm.get(kk);if(jEq(l,x))return;
    if(b&&jEq(l,b))m.set(kk,x);else if(b&&jEq(x,b))return;else if(preferI)m.set(kk,x)});
  for(const kk of bm.keys())if(m.has(kk)&&(!lk.has(kk)||!ik.has(kk)))m.delete(kk); /* auf einer Seite seit dem letzten Abgleich entfernt */
  const out=[...m.values()].map(x=>clone(x));if(k==="log")out.sort((a,b)=>(a.at||0)-(b.at||0));return out}
function merge3(L,I,B,preferI,skip){const out={},keys=new Set([...Object.keys(L||{}),...Object.keys(I||{})]);
  for(const k of keys){if(k==="updated"||(skip&&skip.includes(k)))continue;const l=L[k],i=I[k],b=B?B[k]:undefined;
    if(jEq(l,i)){if(l!==undefined)out[k]=clone(l);continue}
    if(UNION[k]&&(Array.isArray(l)||Array.isArray(i))){out[k]=mergeArr(k,l||[],i||[],Array.isArray(b)?b:[],preferI);continue}
    if(B){if(jEq(l,b)){if(i!==undefined)out[k]=clone(i);continue}if(jEq(i,b)){if(l!==undefined)out[k]=clone(l);continue}}
    const v=preferI?i:l;if(v!==undefined)out[k]=clone(v)}
  out.updated=Math.max(L.updated||0,I.updated||0);return out}
/* Liegenschaft: Grunddaten feldgenau, Tabellenzeilen beider Geräte vereint (gelöschte bleiben gelöscht), gleiche Zeile feldgenau */
function objMerge(L,I,delRows,B){
  const preferI=(I.updated||0)>(L.updated||0),out=merge3(L,I,B,preferI,["rows"]);out.rows={};
  const secs=new Set([...Object.keys(L.rows||{}),...Object.keys(I.rows||{})]);
  secs.forEach(sec=>{const lr=(L.rows||{})[sec]||[],ir=(I.rows||{})[sec]||[],br=((B&&B.rows)||{})[sec]||[],res=[],seen=new Set();
    const pick=r=>!r.id||!delRows.has(r.id);
    lr.filter(pick).forEach(r=>{const o=r.id&&ir.find(x=>x.id===r.id);seen.add(r.id);
      if(!o){res.push(clone(r));return}
      res.push(merge3(r,o,br.find(x=>x.id===r.id),preferI))});
    ir.filter(pick).forEach(r=>{if(r.id&&seen.has(r.id))return;res.push(clone(r))});
    res.forEach(r=>{if(r.updated===0)delete r.updated});out.rows[sec]=res});
  return norm(out)}
function setSyncBase(d){const b={objekte:clone(d.objekte||{})};COLLS.filter(n=>n!=="historie").forEach(n=>b[n]=clone(d[n]||{}));syncBase=b;idbPut("kv","syncbase",b).catch(()=>{})}function mergePlan(d,useBase){
  const base=useBase&&syncBase?syncBase:null,bOf=(n,id)=>base?((n?base[n]:base.objekte)||{})[id]:undefined;
  const newer=(a,b)=>!a?b:!b?a:((b.updated||b.until||b.at||0)>(a.updated||a.until||a.at||0)?b:a);
  const hist={};if(C.historie){C.historie.map.forEach((h,id)=>hist[id]=h);Object.entries(d.historie||{}).forEach(([id,h])=>hist[id]=newer(hist[id],h))}
  const del={};Object.values(hist).forEach(h=>{if(h&&h.act==="gelöscht"&&h.snap&&!h.restored){const s=h.snap,k=s.type==="rec"?`rec:${s.m}:${s.id}`:s.type==="obj"?`obj:${s.id}`:"";if(k)del[k]=Math.max(del[k]||0,h.at||0)}});
  const ops=[],cnt={neu:0,upd:0,keep:0,del:0};
  const delRows=new Set();Object.values(hist).forEach(h=>{if(h&&h.act==="gelöscht"&&h.snap&&h.snap.type==="row"&&!h.restored&&h.snap.data&&h.snap.data.id)delRows.add(h.snap.data.id)});
  const plan=(kind,n,local,inc)=>{inc=inc||{};new Set([...local.keys(),...Object.keys(inc)]).forEach(id=>{
    const L=local.get(id),I=inc[id],tL=(L&&L.updated)||0,tI=(I&&I.updated)||0,dt=del[kind==="obj"?`obj:${id}`:`rec:${n}:${id}`];
    if(dt&&Math.max(tL,tI)<dt){if(L){ops.push({kind,n,id,op:"del"});cnt.del++}return}
    if(!I)return;
    if(!L){ops.push({kind,n,id,op:"set",data:I});cnt.neu++;return}
    const sL=JSON.stringify(L);if(sL===JSON.stringify(I))return;
    const mg=kind==="obj"?objMerge(L,I,delRows,bOf(null,id)):merge3(L,I,bOf(n,id),tI>tL);
    if(JSON.stringify(mg)!==sL){ops.push({kind,n,id,op:"set",data:mg});cnt.upd++}else cnt.keep++})};
  plan("obj",null,objs,d.objekte);
  COLLS.filter(n=>n!=="historie").forEach(n=>plan("rec",n,C[n].map,d[n]));
  if(C.historie)Object.entries(d.historie||{}).forEach(([id,h])=>{const L=C.historie.map.get(id);if(!L||(newer(L,h)===h&&JSON.stringify(L)!==JSON.stringify(h)))ops.push({kind:"rec",n:"historie",id,op:"set",data:h})});
  return {ops,cnt};
}

function modelHTML(models,docTitle){

      :b.kv2?`<table class="kv kv2">${(()=>{let h="";for(let i=0;i<b.kv2.length;i+=2){const a=b.kv2[i],c=b.kv2[i+1]||["",""];h+=`<tr><th>${e(cellT(a[0]))}</th>${cell(a[1])}<th>${e(cellT(c[0]))}</th>${cell(c[1])}</tr>`}return h})()}</table>`
      :b.table?`<table>${b.table.head?`<tr>${b.table.head.map(h=>`<th>${e(cellT(h))}</th>`).join("")}</tr>`:""}${b.table.rows.map(r=>{const cs=Array.isArray(r)?r:r.cells;return `<tr${r.hl==="red"?' style="background:#fbe1df"':""}>${cs.map(cell).join("")}</tr>`}).join("")}</table>`
      :b.p!=null?`<p>${e(b.p).replace(/\n/g,"<br>")}</p>`:b.box?`<div style="font-size:12pt;font-weight:700;padding:8px;border:2px solid #111;margin-top:6px">${e(b.box)}</div>`
      :b.sig?`<div class="sig"><div>${e(b.sig.date||"")}<div class="line">Datum</div></div><div>${b.sig.img?`<img src="${b.sig.img}" alt="">`:""}<div class="line">${e(b.sig.label||"Unterschrift")}</div></div></div>`

  return `<!doctype html><html lang="de"><head><meta charset="utf-8"><title>${e(docTitle)}</title><style>${DOC_CSS} td.over{color:#B3261E;font-weight:700} td.bold{font-weight:700}</style></head><body>${body}</body></html>`;
}
async function outDoc(models,docTitle,kind){
  if(kind==="print")return printHTML(modelHTML(models,docTitle));
  setSave("busy","PDF wird erstellt …");
  let bytes;try{bytes=await renderPDF(models,docTitle)}catch(e){setSave("err",window.PDFLib?"PDF konnte nicht erstellt werden":"Für die erste PDF-Erstellung wird Internet benötigt");return}
  try{await saveFile(docTitle.replace(/[\\/:*?"<>|]/g,"-")+".pdf",bytes,"application/pdf");setSave("ok","PDF erstellt")}
  catch(e){setSave(e&&e.code==="declined"?"ok":"err",e&&e.code==="declined"?savedLabel():"PDF konnte nicht gespeichert werden")}
}

/* Verträge: aktuelles Laufzeitende (mit automatischer Verlängerung) und letzter Kündigungstag */
/* frühestmögliches Vertragsende: Ist die Kündigungsfrist einer Laufzeit verstrichen (und nicht gekündigt), verlängert sich der Vertrag */
function vtEnde(r){if(!r.ende)return "";let e=r.ende;const v=+r.verl||0;if((r.status&&r.status!=="aktiv")||!v)return e;
  const t=today(),kf=num(r.kfrist||0);let guard=0;while(addMonths(e,-kf)<t&&guard++<200)e=addMonths(e,v);return e}
function vtKuend(r){const e=vtEnde(r);if(!e||r.status!=="aktiv"||!(+r.verl))return "";return addMonths(e,-num(r.kfrist||0))}
/* Zähler: Ablesungen sortiert, letzter Stand, Verbrauch je Kalenderjahr (Summe der Differenzen, Zählerwechsel beginnt neu) */
function zList(r){return (r.staende||[]).filter(s=>s.datum&&s.stand!==""&&s.stand!=null).slice().sort((a,b)=>a.datum<b.datum?-1:a.datum>b.datum?1:(a.at||0)-(b.at||0))}
function zLast(r){const l=zList(r);return l[l.length-1]||null}
function zDiffs(r){const l=zList(r),out=[];for(let i=1;i<l.length;i++){if(l[i].wechsel)continue;out.push({datum:l[i].datum,von:l[i-1].datum,v:Math.round((num(l[i].stand)-num(l[i-1].stand))*100)/100})}return out}
function zYear(r,y){const d=zDiffs(r).filter(x=>x.datum.startsWith(String(y)));return d.length?Math.round(d.reduce((a,x)=>a+x.v,0)*100)/100:null}

    if(R.length)out.push([label,R])});

/* ---------- Merkliste: Personen & Firmen zum Auswählen ----------
   Die Vorschläge werden aus den vorhandenen Daten gebildet (Aufträge, Wartung, Termine, Schlüssel, Prüfungen)
   und reisen deshalb mit Sicherung und Abgleich automatisch mit. */
const MEM_SEL='[data-rf="zust"],[data-rf="gemeldet"],[data-rf="dienst"],[data-rf="firma"],[data-rf="partner"],#sg-name,#hx-von,#ka-an,#ka-firma,#ka-von,#kr-von,#f-bearbeiter,[data-prf="pruefer"]';
const MEM_HIDE_KEY=APP_ID+"-merkliste-aus";
function memHidden(){try{return new Set(JSON.parse(localStorage.getItem(MEM_HIDE_KEY)||"[]"))}catch(e){return new Set()}}
function memSetHidden(h){try{localStorage.setItem(MEM_HIDE_KEY,JSON.stringify([...h]))}catch(e){}}
function memValues(){
  const m=new Map();
  const add=(v,at)=>{v=String(v||"").trim();if(!v||v.length>80)return;const k=normQ(v),e=m.get(k);
    if(e){e.n++;if((at||0)>e.at){e.at=at||0;e.v=v}}else m.set(k,{v,n:1,at:at||0})};
  recs("auftraege").forEach(([,t])=>{add(t.zust,t.updated);add(t.gemeldet,t.updated);if(t.abschluss)add(t.abschluss.name,t.abschluss.at)});
  recs("wartung").forEach(([,p])=>{add(p.dienst,p.updated);(p.hist||[]).forEach(h=>add(h.von,p.updated))});
  recs("taetig").forEach(([,t])=>add(t.firma,t.updated));
  recs("vertraege").forEach(([,v])=>add(v.partner,v.updated));
  recs("schluessel").forEach(([,k])=>(k.ausgaben||[]).forEach(a=>{add(a.an,a.at);add(a.firma,a.at);add(a.von,a.at);if(a.zur)add(a.zur.von,a.zur.at)}));
  objs.forEach(o=>{add(o.bearbeiter,o.updated);["leiter","tritt"].forEach(s=>(o.rows[s]||[]).forEach(r=>(r.pruef||[]).forEach(p=>add(p.pruefer,+p.done||0))))});
  try{add(JSON.parse(localStorage.getItem("begehung-pruefer")||"{}").pruefer,Date.now())}catch(e){}
  activeUsers().forEach(([,u])=>{add(u.name,Date.now());const e=m.get(normQ(u.name));if(e)e.n+=1000});
  const hid=memHidden();
  return [...m.entries()].filter(([k])=>!hid.has(k)).map(([,e])=>e).sort((a,b)=>b.n-a.n||b.at-a.at);
}
let memEl=null,memInp=null,memIdx=-1;
function memBox(){if(memEl)return memEl;
  memEl=document.createElement("div");memEl.className="memdd";memEl.setAttribute("role","listbox");memEl.hidden=true;document.body.appendChild(memEl);
  memEl.addEventListener("pointerdown",e=>{e.preventDefault();
    const x=e.target.closest("[data-memx]");if(x){const h=memHidden();h.add(normQ(x.dataset.memx));memSetHidden(h);memShow();return}
    const o=e.target.closest("[data-memv]");if(o)memPick(o.dataset.memv)});
  return memEl}
function memShow(){const inp=memInp;if(!inp||document.activeElement!==inp)return memClose();
  const cur=inp.value.trim(),q=normQ(cur);
  const list=memValues().filter(e=>e.v!==cur&&(!q||normQ(e.v).includes(q))).slice(0,8);
  const el=memBox();if(!list.length){el.hidden=true;return}
  el.innerHTML=`<div class="memh">${q?"Passende Einträge":"Zuletzt verwendet"}</div>`+list.map((e,i)=>`<div class="memo${i===memIdx?" on":""}" role="option" data-memv="${esc(e.v)}"><span>${hl(e.v,q)}</span><button type="button" class="memx" data-memx="${esc(e.v)}" title="Aus der Liste entfernen" aria-label="${esc(e.v)} aus der Liste entfernen">×</button></div>`).join("");
  const r=inp.getBoundingClientRect();el.style.left=Math.max(8,Math.min(r.left,innerWidth-Math.max(r.width,240)-8))+"px";el.style.width=Math.max(r.width,240)+"px";
  el.hidden=false;const h=el.offsetHeight;el.style.top=(innerHeight-r.bottom<h+8&&r.top>h+8?r.top-h-4:r.bottom+4)+"px"}
function memClose(){if(memEl)memEl.hidden=true;memIdx=-1}
function memPick(v){const inp=memInp;if(!inp)return;inp.value=v;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));memClose();memAutoKontakt(inp,v)}
/* Termine: Bei bekannter Firma die zuletzt verwendeten Kontaktdaten übernehmen */
function memAutoKontakt(inp,v){if(inp.dataset.rf!=="firma"||!recDlg||recDlg.m!=="taetig")return;const r=C.taetig.map.get(recDlg.id);if(!r||r.kontakt)return;
  const src=recs("taetig").filter(([id,t])=>id!==recDlg.id&&normQ(t.firma)===normQ(v)&&t.kontakt).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0))[0];
  const k=$("#rf-kontakt");if(src&&k){k.value=src[1].kontakt;k.dispatchEvent(new Event("input",{bubbles:true}))}}
document.addEventListener("focusin",e=>{const t=e.target;
  if(t.matches&&t.matches(MEM_SEL)&&!t.readOnly&&!t.disabled){t.setAttribute("autocomplete","off");memInp=t;memIdx=-1;memShow()}
  else if(!memEl||!memEl.contains(t)){memInp=null;memClose()}});
document.addEventListener("focusout",e=>{if(e.target===memInp)setTimeout(()=>{if(document.activeElement!==memInp){memInp=null;memClose()}},150)});

document.addEventListener("change",e=>{const t=e.target;if(t.matches&&t.matches(MEM_SEL)&&t.value.trim()){const h=memHidden();if(h.delete(normQ(t.value.trim())))memSetHidden(h)}});
document.addEventListener("keydown",e=>{if(!memInp||e.target!==memInp||!memEl||memEl.hidden)return;const its=[...memEl.querySelectorAll(".memo")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();memIdx=e.key==="ArrowDown"?Math.min(memIdx+1,its.length-1):Math.max(memIdx-1,-1);its.forEach((x,i)=>x.classList.toggle("on",i===memIdx))}
  else if(e.key==="Enter"&&memIdx>=0&&its[memIdx]){e.preventDefault();memPick(its[memIdx].dataset.memv)}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();memClose()}},true);
window.addEventListener("scroll",()=>{if(memEl&&!memEl.hidden)memShow()},true);
window.addEventListener("resize",()=>{if(memEl&&!memEl.hidden)memShow()});

/* ---------- QR-Codes: Etiketten drucken & in der App scannen ---------- */
const libP={};
function loadLib(name,local,cdn){if(window[name])return Promise.resolve(window[name]);
  const tryLoad=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;
    s.onload=()=>window[name]?res(window[name]):rej(new Error("load"));s.onerror=()=>{s.remove();rej(new Error("load"))};document.head.appendChild(s)});
  return libP[name]=libP[name]||tryLoad(local).catch(()=>tryLoad(cdn)).catch(e=>{libP[name]=null;throw e})}
const loadQRGen=()=>loadLib("qrcode","qrcode.min.js","https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
const loadJsQR=()=>loadLib("jsQR","jsQR.min.js","https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js");
async function qrMatrix(text){const Q=await loadQRGen(),q=Q(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=[];
  for(let r=0;r<n;r++){const row=[];for(let c=0;c<n;c++)row.push(q.isDark(r,c));m.push(row)}return m}
const QR={lad:(oid,sec,rid)=>`FMS:L:${oid}:${sec}:${rid}`,anl:id=>`FMS:A:${id}`,key:id=>`FMS:S:${id}`,obj:oid=>`FMS:O:${oid}`,zae:id=>`FMS:Z:${id}`};
function qrParse(t){const m=/(?:FMS|CAFM):([LASOZ]):(\S+)/.exec(String(t||""));return m?{k:m[1],p:m[2].split(":")}:null}
function ladLabel(oid,sec,r){const o=objs.get(oid)||{},kind=sec==="leiter"?"Leiter":"Tritt";
  return {code:QR.lad(oid,sec,r.id),title:r.inv||kind,sub:[r.art||kind,r.typ].filter(Boolean).join(" · "),place:[LAD_ONLY?r.lieg:o.name,r.ort].filter(Boolean).join(" · ")}}
function anlLabel(id,r){return {code:QR.anl(id),title:r.inv||"Anlage",sub:r.bez||"",place:[liegShort(r.lieg),r.ort].filter(Boolean).join(" · ")}}
function keyLabel(id,r){return {code:QR.key(id),title:r.nr||"Schlüssel",sub:r.bez||"",place:[liegShort(r.lieg),r.schliess].filter(Boolean).join(" · ")}}
function zLabel(id,r){return {code:QR.zae(id),title:[r.art,r.nr].filter(Boolean).join(" ")||"Zähler",sub:r.bez||"",place:[liegShort(r.lieg),r.ort].filter(Boolean).join(" · "),foot:"Scannen und Zählerstand erfassen"}}
function recLabel(m,id,r){return m==="anlagen"?anlLabel(id,r):m==="zaehler"?zLabel(id,r):keyLabel(id,r)}

const LBL_FMT=[["62x29","62 × 29 mm (z. B. Brother DK-11209)",62,29],["62x40","62 × 40 mm (Brother 62-mm-Endlosband)",62,40],["50x30","50 × 30 mm (z. B. Niimbot, Phomemo)",50,30],["40x30","40 × 30 mm",40,30],["40x20","40 × 20 mm",40,20],["eigen","Eigene Größe …",0,0]];
const LBL_KEY=APP_ID+"-etikett";
function lblPrefs(){let p={fmt:"62x29",w:62,h:29};try{Object.assign(p,JSON.parse(localStorage.getItem(LBL_KEY)||"{}"))}catch(e){}return p}
function lblSize(l){const f=LBL_FMT.find(x=>x[0]===l.fmt);return f&&f[2]?[f[2],f[3]]:[Math.min(150,Math.max(15,num(l.w)||50)),Math.min(150,Math.max(10,num(l.h)||30))]}
/* Aufteilung eines Etiketts (alle Maße in mm): QR links, Text rechts */
function lblLayout(it,w,h,measure){
  const M=Math.max(1.5,Math.min(w,h)*.06),qr=Math.min(h-2*M,w*.5),tx=M+qr+Math.max(1.5,M*.8),tw=w-tx-M;
  const fit=(t,sz,b)=>{t=String(t||"");if(!t||measure(t,sz,b)<=tw)return t;while(t.length>1&&measure(t+"…",sz,b)>tw)t=t.slice(0,-1);return t+"…"};
  const lines=[],avail=h-2*M;let y=M;
  const spec=[[it.title,Math.min(avail*.3,6.2),true],[it.sub,Math.min(avail*.17,3.6),false],[it.place,Math.min(avail*.15,3.2),false]];
  if(avail>=22)spec.push([it.foot||"In der FMS-App scannen",Math.min(avail*.1,2.3),false,true]);
  for(const [t,sz,b,muted] of spec){if(!t)continue;if(y+sz*1.05>h-M+.01)break;lines.push({t:fit(t,sz,b),sz,b,muted,base:y+sz*.82,x:tx});y+=sz*1.3}
  return {M,qr,qx:M,qy:(h-qr)/2,lines,tw}}
async function lblCanvas(it,w,h,dpi){
  const px=mm=>mm/25.4*dpi,c=document.createElement("canvas");c.width=Math.round(px(w));c.height=Math.round(px(h));const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
  const font=(sz,b)=>`${b?"bold ":""}${px(sz)}px Helvetica, Arial, sans-serif`;
  const L=lblLayout(it,w,h,(t,sz,b)=>{g.font=font(sz,b);return g.measureText(t).width/dpi*25.4});
  const m=await qrMatrix(it.code),n=m.length,mod=px(L.qr)/(n+4);g.fillStyle="#000";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m[r][k])g.fillRect(Math.floor(px(L.qx)+(k+2)*mod),Math.floor(px(L.qy)+(r+2)*mod),Math.ceil(mod),Math.ceil(mod));
  L.lines.forEach(l=>{g.font=font(l.sz,l.b);g.fillStyle=l.muted?"#555":"#000";g.fillText(l.t,px(l.x),px(l.base))});
  return c}
async function lblPDF(items,w,h){
  const P=await loadPDFLib(),doc=await P.PDFDocument.create();doc.setTitle("QR-Etiketten");doc.setCreator(APP_LABEL);
  const F=await doc.embedFont(P.StandardFonts.Helvetica),B=await doc.embedFont(P.StandardFonts.HelveticaBold),k=72/25.4,black=P.rgb(0,0,0),gray=P.rgb(.33,.33,.33);
  const safe=(s,f)=>{let o="";for(const ch of String(s)){try{f.encodeText(ch);o+=ch}catch(e){o+=ch==="·"?"-":"?"}}return o};
  for(const it of items){const pg=doc.addPage([w*k,h*k]);
    const L=lblLayout(it,w,h,(t,sz,b)=>(b?B:F).widthOfTextAtSize(safe(t,b?B:F),sz*k)/k);
    const m=await qrMatrix(it.code),n=m.length,mod=L.qr/(n+4);
    for(let r=0;r<n;r++){let c0=-1;for(let c=0;c<=n;c++){const d=c<n&&m[r][c];if(d&&c0<0)c0=c;if(!d&&c0>=0){
      pg.drawRectangle({x:(L.qx+(c0+2)*mod)*k,y:(h-(L.qy+(r+3)*mod))*k,width:(c-c0)*mod*k+.05,height:mod*k+.05,color:black});c0=-1}}}
    L.lines.forEach(l=>{const f=l.b?B:F;pg.drawText(safe(l.t,f),{x:l.x*k,y:(h-l.base)*k,size:l.sz*k,font:f,color:l.muted?gray:black})})}
  return await doc.save()}

    <div class="dlg-h"><div><h2 id="lbT">${esc(l.title)}</h2><p>Etikett aufkleben, später mit „QR scannen“ in der App direkt öffnen.</p></div><button class="x" type="button" data-lb="close" aria-label="Schließen">×</button></div>
    <div class="dlg-b">
      <div class="form plain">

      </div>

      ${l.items.length>1?`<div class="fld wide"><span class="lbl">Etiketten (${n} von ${l.items.length})</span>
        <div class="actions"><button class="btn sm ghost" type="button" data-lb="all">Alle</button><button class="btn sm ghost" type="button" data-lb="none">Keine</button></div>
        <div class="lblist">${l.items.map((it,i)=>`<label class="lbit"><input type="checkbox" data-lbi="${i}"${l.sel.has(i)?" checked":""}><span><b>${esc(it.title)}</b><small>${esc([it.sub,it.place].filter(Boolean).join(" · "))}</small></span></label>`).join("")}</div></div>`:""}
      <p class="note" style="margin:0"><b>Drucker mit AirPrint / am PC:</b> „PDF zum Drucken“ – jede Seite ist ein Etikett. <b>Bluetooth-Etikettendrucker</b> (Niimbot, Phomemo, P-touch Cube …): „Als Bild“ und das Bild in der App des Druckers öffnen.</p>
      ${l.msg?`<div class="msg ${l.msg.split(":")[0]}">${esc(l.msg.split(/:(.*)/s)[1])}</div>`:""}
    </div>
    <div class="dlg-f"><span class="note">${n===1?"1 Etikett":n+" Etiketten"}</span><div class="actions">
      <button class="btn" type="button" data-lb="png"${!n||l.busy?" disabled":""}>Als Bild${n>1?"er":""}</button>
      <button class="btn pri" type="button" data-lb="pdf"${!n||l.busy?" disabled":""}>${l.busy==="pdf"?"Wird erstellt …":"PDF zum Drucken"}</button></div></div></div>`;
  lblPreview()}
async function lblPreview(){const l=lbl,box=$("#lbPrev");if(!l||!box)return;const [w,h]=lblSize(l);const i=[...l.sel][0]??0;
  try{const c=await lblCanvas(l.items[i],w,h,200);if(lbl!==l)return;c.className="lbcanvas";c.style.aspectRatio=`${w}/${h}`;box.innerHTML="";box.appendChild(c)}
  catch(e){box.innerHTML=`<span class="msg err">QR-Bibliothek konnte nicht geladen werden.</span>`}}
function lblSavePrefs(){try{localStorage.setItem(LBL_KEY,JSON.stringify({fmt:lbl.fmt,w:lbl.w,h:lbl.h}))}catch(e){}}
async function lblClick(e){const b=e.target.closest("[data-lb]");if(!b||!lbl)return;const a=b.dataset.lb,l=lbl;
  if(a==="close"){lbl=null;return closeImport()}
  if(a==="all"){l.items.forEach((_,i)=>l.sel.add(i));return renderLabels()}
  if(a==="none"){l.sel.clear();return renderLabels()}
  const [w,h]=lblSize(l),items=[...l.sel].sort((x,y)=>x-y).map(i=>l.items[i]);if(!items.length)return;
  const fname=t=>String(t).replace(/[\\/:*?"<>|]/g,"-").slice(0,60);
  if(a==="pdf"){l.busy="pdf";l.msg="";renderLabels();
    try{const bytes=await lblPDF(items,w,h);await saveFile(`QR-Etiketten ${items.length===1?fname(items[0].title)+" ":""}${today()}.pdf`,bytes,"application/pdf");l.msg="ok:PDF erstellt."}
    catch(err){if(!(err&&err.code==="declined"))l.msg="err:Das PDF konnte nicht erstellt werden."}
    l.busy="";if(lbl===l)renderLabels();return}
  if(a==="png"){l.busy="png";renderLabels();
    try{for(const it of items){const c=await lblCanvas(it,w,h,300);const blob=await new Promise(r=>c.toBlob(r,"image/png"));await saveFile(`QR ${fname(it.title)}.png`,blob,"image/png")}l.msg="ok:Bild erstellt."}
    catch(err){if(!(err&&err.code==="declined"))l.msg="err:Das Bild konnte nicht erstellt werden."}
    l.busy="";if(lbl===l)renderLabels()}}
document.addEventListener("change",e=>{if(!lbl)return;const t=e.target;
  if(t.id==="lbFmt"){lbl.fmt=t.value;lblSavePrefs();renderLabels()}
  else if(t.dataset&&t.dataset.lbi!=null){const i=+t.dataset.lbi;t.checked?lbl.sel.add(i):lbl.sel.delete(i);renderLabels()}});
document.addEventListener("input",e=>{if(!lbl)return;const t=e.target;if(t.id==="lbW"||t.id==="lbH"){lbl[t.id==="lbW"?"w":"h"]=t.value;lblSavePrefs();clearTimeout(t._t);t._t=setTimeout(lblPreview,300)}});

/* ---------- Störmelde-QR: Aushang, über den jeder (ohne App) eine Störung per E-Mail meldet ----------
   Der QR-Code führt auf melden.html (liegt neben der App auf GitHub Pages). Die Mail kommt beim Hausmeister an
   und wird mit „Aus E-Mail“ zum Auftrag – Liegenschaft, Ort und Dringlichkeit werden dabei erkannt. */
const MQ_KEY=APP_ID+"-stoermeldung";
let mq=null;
function mqPrefs(){let p={to:"",url:""};try{Object.assign(p,JSON.parse(localStorage.getItem(MQ_KEY)||"{}"))}catch(e){}
  if(!p.url&&/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname))p.url=location.origin+location.pathname.replace(/[^/]*$/,"");return p}
function openMeldQR(oid){const p=mqPrefs();mq={oid,to:p.to,url:p.url,rooms:"",msg:""};$("#imp").hidden=false;renderMQ()}
function renderMQ(){const s=mq,o=objs.get(s.oid);if(!o)return closeImport();
  $("#imp").innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mqT" style="max-width:640px">
    <div class="dlg-h"><div><h2 id="mqT">Störmelde-QR für ${esc(o.name||"Liegenschaft")}</h2><p>Aushang für Kita-Personal, Gemeinde oder Gäste: Code mit der Handy-Kamera scannen, kurz beschreiben, E-Mail geht an dich. Mit „Aus E-Mail“ wird daraus ein Auftrag.</p></div><button class="x" type="button" data-mq="close" aria-label="Schließen">×</button></div>
    <div class="dlg-b"><div class="form plain">
      <div class="fld"><label for="mq-to">Meldungen per E-Mail an</label><input id="mq-to" type="email" value="${esc(s.to)}" placeholder="hausmeister@…" autocomplete="email"></div>
      <div class="fld"><label for="mq-url">Adresse der Web-App (GitHub Pages)</label><input id="mq-url" value="${esc(s.url)}" placeholder="https://name.github.io/fms/"></div>
      <div class="fld wide"><label for="mq-rooms">Räume, je Zeile ein Etikett (leer = ein Etikett für das ganze Gebäude)</label><textarea id="mq-rooms" placeholder="Gruppenraum 1&#10;Gruppenraum 2&#10;Küche&#10;Personal-WC">${esc(s.rooms)}</textarea></div></div>
      <p class="note" style="margin:0">Die E-Mail-Adresse steht im QR-Code und ist damit für jeden lesbar, der den Code scannt. Am besten eine Funktionsadresse verwenden.</p>
      ${s.msg?`<div class="msg err">${esc(s.msg)}</div>`:""}</div>
    <div class="dlg-f"><span></span><div class="actions"><button class="btn" type="button" data-mq="close">Abbrechen</button><button class="btn pri" type="button" data-mq="go">Etiketten erstellen</button></div></div></div>`}
function mqClick(e){const b=e.target.closest("[data-mq]");if(!b||!mq)return;if(b.dataset.mq==="close"){mq=null;return closeImport()}
  const s=mq;s.to=$("#mq-to").value.trim();s.url=$("#mq-url").value.trim();s.rooms=$("#mq-rooms").value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.to)){s.msg="Bitte eine gültige E-Mail-Adresse eintragen.";return renderMQ()}
  if(!/^https:\/\/[^\s]+$/i.test(s.url)){s.msg="Bitte die Adresse der Web-App eintragen (beginnt mit https://), z. B. https://name.github.io/fms/";return renderMQ()}
  let base=s.url.replace(/(index\.html|melden\.html)?([?#].*)?$/,"");if(!base.endsWith("/"))base+="/";
  try{localStorage.setItem(MQ_KEY,JSON.stringify({to:s.to,url:base}))}catch(_){}
  const o=objs.get(s.oid),ln=liegName(s.oid),rooms=s.rooms.split("\n").map(x=>x.trim()).filter(Boolean);
  const items=(rooms.length?rooms:[""]).map(rm=>({code:`${base}melden.html?l=${encodeURIComponent(ln)}${rm?`&o=${encodeURIComponent(rm)}`:""}&t=${encodeURIComponent(s.to)}`,
    title:"Störung melden",sub:rm||"Defekt entdeckt?",place:o.name||ln,foot:"Mit der Handy-Kamera scannen"}));
  mq=null;openLabels(items,"Störmelde-QR "+(o.name||""))}

/* Scanner: Kamera im Programm (die iPad-Kamera-App würde Safari ohne deine Daten öffnen) */
let scan=null;const scCanvas=document.createElement("canvas");
function scanFrame(src,sw,sh,max,both){const s=Math.min(1,(max||800)/Math.max(sw,sh)),w=Math.round(sw*s),h=Math.round(sh*s);scCanvas.width=w;scCanvas.height=h;
  const g=scCanvas.getContext("2d",{willReadFrequently:true});g.drawImage(src,0,0,w,h);const d=g.getImageData(0,0,w,h);
  const r=window.jsQR(d.data,w,h,{inversionAttempts:both?"attemptBoth":"dontInvert"});return r&&r.data}
function scanMsg(t,cls){const m=$("#scMsg");if(m){m.className="msg "+(cls||"");m.textContent=t}}
async function openScan(){scanStop();if(!$("#imp").hidden)closeImport();scan={stream:null,timer:0};$("#imp").hidden=false;
  $("#imp").innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="scT" style="max-width:560px">
    <div class="dlg-h"><div><h2 id="scT">QR-Code scannen</h2><p>Halte das Etikett einer Leiter, eines Tritts, einer Anlage oder eines Schlüssels vor die Kamera.</p></div><button class="x" type="button" data-sc="close" aria-label="Schließen">×</button></div>
    <div class="dlg-b"><div class="scanbox"><video id="scVid" playsinline muted autoplay></video><div class="scanframe" aria-hidden="true"></div></div>
      <p class="msg" id="scMsg">Kamera wird gestartet …</p>
      <div class="actions"><label class="btn sm" for="scFile">${CAM}Foto des Etiketts verwenden</label><input type="file" id="scFile" accept="image/*" hidden></div></div></div>`;
  const s=scan;
  try{const [,stream]=await Promise.all([loadJsQR(),navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})]);
    if(scan!==s){stream.getTracks().forEach(t=>t.stop());return}
    s.stream=stream;const v=$("#scVid");v.srcObject=stream;try{await v.play()}catch(e){}scanMsg("Suche QR-Code …");scanLoop()}
  catch(e){if(scan!==s)return;scanMsg(e&&e.name==="NotAllowedError"?"Kein Zugriff auf die Kamera. Bitte den Zugriff erlauben oder ein Foto des Etiketts verwenden.":window.jsQR?"Kamera nicht verfügbar. Du kannst ein Foto des Etiketts verwenden.":"Der Scanner konnte nicht geladen werden.","err")}}
function scanLoop(){const s=scan;if(!s||!s.stream)return;const v=$("#scVid");
  if(v&&v.readyState>=2&&v.videoWidth){const t=scanFrame(v,v.videoWidth,v.videoHeight,800,false);if(t&&scanHit(t))return}
  s.timer=setTimeout(scanLoop,120)}
function scanStop(){if(!scan)return;clearTimeout(scan.timer);if(scan.stream)scan.stream.getTracks().forEach(t=>t.stop());scan=null}
function scanHit(t){const q=qrParse(t);if(!q){scanMsg("Das ist kein Etikett aus dieser App.","err");return false}
  const [a,b,c]=q.p;let go=null;
  if(q.k==="L"){const o=objs.get(a),r=o&&Array.isArray(o.rows[b])&&o.rows[b].find(x=>x.id===c);if(r)go=()=>{active=a;tab=LAD_ONLY?b:"leiter";if(!LAD_ONLY)sub.leiter=b;detailOn=true;setView("lieg");openPruef(b,c)}}
  else if(q.k==="A"&&C.anlagen&&C.anlagen.map.has(a))go=()=>{setView("anlagen");openRec("anlagen",a)};
  else if(q.k==="S"&&C.schluessel&&C.schluessel.map.has(a))go=()=>{setView("schluessel");openRec("schluessel",a)};
  else if(q.k==="Z"&&C.zaehler&&C.zaehler.map.has(a))go=()=>{setView("zaehler");openRec("zaehler",a);setTimeout(()=>{const i=$("#zs-stand");if(i)i.focus()},60)};
  else if(q.k==="O"&&objs.has(a))go=()=>{active=a;tab="stamm";detailOn=true;setView("lieg")};
  if(!go){scanMsg("Eintrag nicht gefunden – gelöscht oder auf diesem Gerät noch nicht abgeglichen.","err");return false}
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  scanStop();closeImport();go();return true}
document.addEventListener("change",async e=>{if(e.target.id!=="scFile"||!scan)return;const f=e.target.files[0];e.target.value="";if(!f)return;
  scanMsg("Foto wird ausgewertet …");try{await loadJsQR();const bmp=await createImageBitmap(f);const t=scanFrame(bmp,bmp.width,bmp.height,1600,true);
    if(!t)scanMsg("Auf dem Foto wurde kein QR-Code erkannt. Bitte näher und scharf fotografieren.","err");else scanHit(t)}catch(err){scanMsg("Das Foto konnte nicht gelesen werden.","err")}});
$("#scanBtn").addEventListener("click",openScan);
